# Reviewed choices for `scripts/import_connector.py googlesheets`. They win over the importer's guesses.
# Under `tools`, keys are Composio slugs: set `action_class` (read, write, delete, money) with `why`,
# `skip` with a reason, or `id` to name the tool in Studio.
# Writing an empty value clears a cell; that stays a write (it asks first), like editing any cell by hand.
capability_prefix: sheets

tools:
  GOOGLESHEETS_VALUES_UPDATE:
    name: Update cells
    description: Write values into a range of a spreadsheet, by spreadsheet id and range, overwriting what is there.
      Values can be entered as typed or kept raw. Returns how many cells changed.
    id: update_cells
  GOOGLESHEETS_ADD_SHEET:
    name: Add sheet
    description: Add a new tab (sheet) to a spreadsheet, by spreadsheet id, with an optional title and settings such
      as size, tab color, position and visibility. Returns the new sheet's id.
    id: add_sheet
  GOOGLESHEETS_CREATE_GOOGLE_SHEET1:
    name: Create spreadsheet
    description: Create a new spreadsheet in the connected account's drive, with an optional title. Returns the new
      spreadsheet's id and web address.
    drop: [folder_id, folder_name]  # a shared folder would share the new sheet; it is made in My Drive
  GOOGLESHEETS_MOVE_SPREADSHEET_TO_FOLDER:
    skip: Moves the file to another Drive folder, which can share it with that folder's members.
  GOOGLESHEETS_SPREADSHEETS_SHEETS_COPY_TO:
    skip: Copies a tab into any other spreadsheet, including one outside the business.

  # Names and descriptions the Studio shows (its picker prefixes the app name) and agents read.
  GOOGLESHEETS_AGGREGATE_COLUMN_DATA:
    name: Aggregate column
    description: Sum, average, count, find the min or max of, or take a percentage of one column in a sheet, by
      spreadsheet id and sheet name, optionally only over rows where another column matches a value. Returns the
      result and the rows it used.
  GOOGLESHEETS_APPEND_DIMENSION:
    name: Add empty rows or columns
    description: Add a number of empty rows or columns to the end of a sheet, by spreadsheet id and sheet id, making
      it bigger.
  GOOGLESHEETS_AUTO_RESIZE_DIMENSIONS:
    name: Auto-fit rows or columns
    description: Resize a range of rows or columns in a sheet to fit their content, by spreadsheet id, sheet and start
      and end positions.
  GOOGLESHEETS_BATCH_UPDATE_VALUES_BY_DATA_FILTER:
    name: Update values by filter
    description: Write values into the ranges of a spreadsheet that match given data filters rather than fixed cell
      ranges, by spreadsheet id. Returns how many cells changed.
  GOOGLESHEETS_CREATE_CHART:
    name: Create chart
    description: Create a chart on a sheet from a data range, by spreadsheet id and sheet id, with a chart type and
      optional title, axis titles, legend position and colors. Returns the new chart's id.
  GOOGLESHEETS_CREATE_SPREADSHEET_COLUMN:
    name: Insert column
    description: Insert one empty column into a sheet, by spreadsheet id and sheet id or name, at a given position,
      optionally with the formatting of the column before it.
  GOOGLESHEETS_CREATE_SPREADSHEET_ROW:
    name: Insert row
    description: Insert one empty row into a sheet, by spreadsheet id and sheet id or name, at a given position, optionally
      with the formatting of the row above.
  GOOGLESHEETS_EXPORT_DRIVE_FILE:
    name: Export spreadsheet
    description: 'Export a whole spreadsheet as a file in the chosen format, by file id: XLSX, ODS, PDF, CSV, TSV or
      a zip of web pages. Returns the file.'
  GOOGLESHEETS_EXPORT_SHEET_AS_PDF:
    name: Export sheet as PDF
    description: Export one sheet, or a rectangle of cells in it, as a PDF, by spreadsheet id and sheet id, with settings
      for orientation, margins, gridlines and fitting to the page width.
  GOOGLESHEETS_FIND_REPLACE:
    name: Find and replace
    description: Find text in a spreadsheet, by spreadsheet id, and replace it in one sheet, a range or every sheet,
      with options to match case or whole cells and to include formulas. Returns how many cells changed.
  GOOGLESHEETS_FORMAT_CELL:
    name: Format cells
    description: 'Apply formatting to a range of cells in a sheet, by spreadsheet id and sheet: text color, bold, italic,
      font, size, alignment, wrapping, borders, background and number format.'
  GOOGLESHEETS_GET_CONDITIONAL_FORMAT_RULES:
    name: List conditional formatting rules
    description: List the conditional formatting rules of a spreadsheet, or of one sheet in it, by spreadsheet id, in
      a plain form that shows each rule's range, condition and format.
  GOOGLESHEETS_GET_DATA_VALIDATION_RULES:
    name: List data validation rules
    description: 'List the data validation rules of a spreadsheet, or of chosen ranges or one sheet, by spreadsheet
      id: dropdown lists, allowed values and custom formulas for cells.'
  GOOGLESHEETS_GET_SHEET_NAMES:
    name: List sheet names
    description: List the names of the tabs (sheets) in a spreadsheet, by spreadsheet id, optionally leaving out hidden
      ones.
  GOOGLESHEETS_GET_SPREADSHEET_BY_DATA_FILTER:
    name: Get spreadsheet by filter
    description: Get a spreadsheet's details and, when asked, the cell data in the ranges that match given data filters,
      by spreadsheet id.
  GOOGLESHEETS_GET_SPREADSHEET_INFO:
    name: Get spreadsheet details
    description: 'Get a spreadsheet''s details by spreadsheet id: its title, its sheets and their properties, and more
      fields or cell data when asked.'
  GOOGLESHEETS_INSERT_DIMENSION:
    name: Insert rows or columns
    description: Insert empty rows or columns into a sheet at a given position, by spreadsheet id, sheet id and the
      range to insert, optionally with the formatting of the row or column before.
  GOOGLESHEETS_LIST_CHARTS:
    name: List charts
    description: List the charts in a spreadsheet across all its sheets, by spreadsheet id, with each chart's id, sheet,
      type, title and position.
  GOOGLESHEETS_LOOKUP_SPREADSHEET_ROW:
    name: Find row
    description: Find the first row in a spreadsheet where a cell exactly matches a search value, by spreadsheet id
      and an optional range. Returns that row's values and position.
  GOOGLESHEETS_MOVE_CHART:
    name: Move or resize chart
    description: Move a chart to a new position or another sheet, or change its size, by spreadsheet id and chart id.
  GOOGLESHEETS_SEARCH_DEVELOPER_METADATA:
    name: Search developer metadata
    description: Find the developer metadata entries in a spreadsheet that match given data filters, by spreadsheet
      id. Returns each entry with its key, value and location.
  GOOGLESHEETS_SEARCH_SPREADSHEETS:
    name: Search spreadsheets
    description: Search the account's spreadsheets by name, content, dates, starred or shared-with-me status, a page
      at a time. Returns the matching spreadsheets with their id, name and dates.
  GOOGLESHEETS_SET_BASIC_FILTER:
    name: Set filter
    description: 'Set the basic filter on a sheet, by spreadsheet id: the range it covers and optional sort order and
      filter criteria per column.'
  GOOGLESHEETS_SET_DATA_VALIDATION_RULE:
    name: Set data validation
    description: 'Set or clear a data validation rule on a range of cells, by spreadsheet id, sheet id and cell positions:
      a dropdown list of values, a dropdown from a range or a custom formula, with an optional help message.'
  GOOGLESHEETS_SORT_RANGE:
    name: Sort range
    description: Sort the rows of a range in a spreadsheet, by spreadsheet id, by one or more columns in ascending or
      descending order.
  GOOGLESHEETS_SPREADSHEETS_VALUES_BATCH_GET_BY_DATA_FILTER:
    name: Read values by filter
    description: Read the values in the ranges of a spreadsheet that match given data filters, by spreadsheet id, with
      options for how values and dates are rendered.
  GOOGLESHEETS_UPDATE_CHART:
    name: Update chart
    description: 'Replace an existing chart''s specification, by spreadsheet id and chart id: its title, type, data
      ranges, colors, axes and other settings.'
  GOOGLESHEETS_UPDATE_DIMENSION_PROPERTIES:
    name: Resize or hide rows or columns
    description: Hide or show a range of rows or columns in a sheet, or set their height or width in pixels, by spreadsheet
      id, sheet and start and end positions.
  GOOGLESHEETS_UPDATE_SHEET_PROPERTIES:
    name: Update sheet properties
    description: 'Change a sheet''s properties within a spreadsheet, by spreadsheet id: its title, position, visibility,
      tab color or grid settings.'
  GOOGLESHEETS_UPDATE_SPREADSHEET_PROPERTIES:
    name: Update spreadsheet properties
    description: 'Change a spreadsheet''s own properties by spreadsheet id: its title, locale, time zone or recalculation
      settings, naming which fields to change.'
  GOOGLESHEETS_UPDATE_VALUES_BATCH:
    name: Update several ranges
    description: Write values into one or more ranges of a spreadsheet in one step, by spreadsheet id, each range with
      its own rows of values. Returns how many cells changed.
  GOOGLESHEETS_UPSERT_ROWS:
    name: Update or add rows
    description: Update the rows of a sheet whose key column matches the given rows and append the rest as new rows,
      by spreadsheet id and sheet name, matching columns by header.
  GOOGLESHEETS_VALUES_GET:
    name: Read range
    description: Read the values in one range of a spreadsheet, by spreadsheet id and range, optionally limited to a
      span of rows, with options for how values and dates are rendered.
