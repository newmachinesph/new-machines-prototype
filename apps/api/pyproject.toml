[project]
name = "nm-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "provider==1.13.0",
    "cachecontrol==0.14.4",
    "cel-python==0.5.0",
    "composio==0.26.0",
    "fastapi==0.141.1",
    "google-auth==2.61.0",
    "jsonschema==4.26.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary,pool]==3.3.6",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "temporalio[google-adk]==1.34.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
