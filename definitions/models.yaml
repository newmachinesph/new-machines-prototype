# Model profiles. Agents name a profile; the environment (NM_MODEL_ENV) picks provider and model.
# Every model is Gemini on Vertex AI. Prices are USD cents per million tokens (input / output).
kind: models
key: default

profiles:
  # For judgement-heavy steps. Priced at the production model, so dev runs are estimated high.
  reasoning:
    envs:
      test: {provider: fake, model: fake-reasoning}
      dev: {provider: vertex, model: gemini-2.5-flash}
      prod: {provider: vertex, model: gemini-2.5-pro}
    price_per_mtok: {input_minor: 125, output_minor: 1000, currency: USD}

  # For high-volume, simple steps.
  fast:
    envs:
      test: {provider: fake, model: fake-fast}
      dev: {provider: vertex, model: gemini-2.5-flash}
      prod: {provider: vertex, model: gemini-2.5-flash}
    price_per_mtok: {input_minor: 30, output_minor: 250, currency: USD}
