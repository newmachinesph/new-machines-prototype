# Work Contract template. The literal "{org}" is replaced with the buyer organisation when a run starts.
kind: contract
key: inbox-lead-tracker
schema_version: nm.work_contract.v1
contract_id: inbox-lead-tracker
version: 1
org_id: "{org}"
capability: sales.lead_tracking
input_schema_ref: inbox-lead-tracker/input
output_schema_ref: inbox-lead-tracker/leads

acceptance:
  verification_ruleset_ref: inbox-lead-tracker/leads
  buyer_acceptance_required: false

authorization:
  tool_capabilities: [mail.read, sheets.write]
  region_policy_ref: region/asia-south1
  policy_ref: policy/default

budget: {currency: USD, maximum_minor: 1000, human_budget_minor: 0}
limits: {max_attempts: 3, deadline_s: 172800}
routes: {success: done, failure: failed, timeout: failed}
