# Work Contract template. The literal "{org}" is replaced with the buyer organisation when a run starts.
kind: contract
key: order-to-cash-exception-desk
schema_version: nm.work_contract.v1
contract_id: order-to-cash-exception-desk
version: 1
org_id: "{org}"
capability: finance.order_to_cash_exceptions
input_schema_ref: order-to-cash-exception-desk/input
output_schema_ref: order-to-cash-exception-desk/report

acceptance:
  verification_ruleset_ref: order-to-cash-exception-desk/report
  buyer_acceptance_required: false

authorization:
  tool_capabilities:
    - orders.read
    - payments.read
    - ledger.read
    - customers.read
    - fulfilment.read
    - sales.read
    - ledger.write
    - fulfilment.write
    - mail.write
  region_policy_ref: region/asia-south1
  policy_ref: policy/default

budget: {currency: USD, maximum_minor: 3000, human_budget_minor: 2500}
limits: {max_attempts: 3, deadline_s: 172800}
routes: {success: done, failure: failed, timeout: failed}
