                    themeColor:
                      enum:
                      - THEME_COLOR_TYPE_UNSPECIFIED
                      - TEXT
                      - BACKGROUND
                      - ACCENT1
                      - ACCENT2
                      - ACCENT3
                      - ACCENT4
                      - ACCENT5
                      - ACCENT6
                      - LINK
                      type: string
                      description: Theme color types.
                  description: Color style representation with either RGB or theme color.
                  additionalProperties: false
              description: The default cell format for the entire spreadsheet.
              additionalProperties: false
            spreadsheetTheme:
              type: object
              properties:
                themeColors:
                  type: array
                  items:
                    type: object
                    required:
                    - colorType
                    - color
                    properties:
                      color:
                        type: object
                        properties:
                          rgbColor:
                            type: object
                            properties:
                              red:
                                type: number
                                maximum: 1
                                minimum: 0
                                description: Red component (0.0 to 1.0)
                              blue:
                                type: number
                                maximum: 1
                                minimum: 0
                                description: Blue component (0.0 to 1.0)
                              alpha:
                                type: number
                                maximum: 1
                                minimum: 0
                                description: Alpha component (0.0 to 1.0)
                              green:
                                type: number
                                maximum: 1
                                minimum: 0
                                description: Green component (0.0 to 1.0)
                            description: RGB color representation.
                            additionalProperties: false
                          themeColor:
                            enum:
                            - THEME_COLOR_TYPE_UNSPECIFIED
                            - TEXT
                            - BACKGROUND
                            - ACCENT1
                            - ACCENT2
                            - ACCENT3
                            - ACCENT4
                            - ACCENT5
                            - ACCENT6
                            - LINK
                            type: string
                            description: Theme color types.
                        description: The color value.
                        additionalProperties: false
                      colorType:
                        enum:
                        - THEME_COLOR_TYPE_UNSPECIFIED
                        - TEXT
                        - BACKGROUND
                        - ACCENT1
                        - ACCENT2
                        - ACCENT3
                        - ACCENT4
                        - ACCENT5
                        - ACCENT6
                        - LINK
                        type: string
                        description: The theme color type.
                    description: A pair of theme color type and color value.
                    additionalProperties: false
                  description: Array of theme color pairs. Each pair contains 'colorType' (TEXT, BACKGROUND, ACCENT1,
                    ACCENT2, ACCENT3, ACCENT4, ACCENT5, ACCENT6, LINK) and 'color' with rgbColor values. All 9 color
                    types must be provided when updating spreadsheetTheme (per Google Sheets API documentation).
                primaryFontFamily:
                  type: string
                  description: The primary font family of the spreadsheet theme.
              description: 'The theme of the spreadsheet. When updating with field mask ''spreadsheetTheme'', provide
                the complete theme object including both primaryFontFamily and themeColors array with all 9 color
                types. Per Google Sheets API documentation, all theme color pairs must be provided when updating the
                theme. Note: Nested field masks (e.g., ''spreadsheetTheme.primaryFontFamily'') produce HTTP 400 errors
                in practice, though not explicitly documented as unsupported.'
              additionalProperties: false
            iterativeCalculationSettings:
              type: object
              properties:
                maxIterations:
                  type: integer
                  description: The maximum number of iterations for iterative calculation.
                convergenceThreshold:
                  type: number
                  description: The threshold for convergence in iterative calculation.
              description: Settings for iterative calculation.
              additionalProperties: false
            importFunctionsExternalUrlAccessAllowed:
              type: boolean
              description: 'Controls whether external URL access is permitted for IMPORTRANGE, IMPORTDATA, IMPORTFEED,
                and IMPORTHTML functions. This field is read-only when true (cannot be disabled once enabled). When
                false, you can set it to true to enable external URL access. Note: This value may be bypassed if the
                admin has enabled URL allowlisting at the organization level.'
          description: 'The spreadsheet-level properties to update (e.g., title, locale, timeZone, autoRecalc). At
            least one field within properties must be set. NOTE: To update individual sheet/tab properties (like renaming
            a specific sheet), use GOOGLESHEETS_UPDATE_SHEET_PROPERTIES instead.'
          additionalProperties: false
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet to update.
        responseRanges:
          type: array
          items:
            type: string
          description: Limits the ranges included in the response spreadsheet. Only meaningful if includeSpreadsheetInResponse
            is true. Ranges should be in A1 notation (e.g., 'Sheet1!A1:B2').
        responseIncludeGridData:
          type: boolean
          description: Determines if grid data (cell values) should be included in the response. Only meaningful if
            includeSpreadsheetInResponse is true. When true, the response will include cell data for the specified
            ranges or entire spreadsheet.
        includeSpreadsheetInResponse:
          type: boolean
          description: Determines if the update response should include the full spreadsheet resource. When true,
            the response will include the entire updated spreadsheet with all sheets, properties, and metadata.
      additionalProperties: false
  - id: batch_update_spreadsheet_values
    slug: GOOGLESHEETS_UPDATE_VALUES_BATCH
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to set values in one or more ranges of a spreadsheet. Use when you need to update multiple ranges
      in a single operation for better performance.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - valueInputOption
      - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - range
            - values
            properties:
              range:
                type: string
                description: The A1 notation of the range to update (e.g., 'Sheet1!A1:B2', 'Sheet1!C:C', or 'A1:D5').
                  The range must specify which cells to update.
              values:
                type: array
                items:
                  type: array
                  items:
                    anyOf:
                    - type: string
                    - type: integer
                    - type: number
                    - type: boolean
                    - type: 'null'
                description: The data to write. This is an array of arrays, the outer array representing all the data
                  and each inner array representing a major dimension. Each item in the inner array corresponds with
                  one cell. Supports string, number, boolean, and null values.
              majorDimension:
                enum:
                - ROWS
                - COLUMNS
                type: string
                description: The major dimension of the values. ROWS (default) means each inner array is a row of
                  values. COLUMNS means each inner array is a column of values.
            description: Data within a range of the spreadsheet.
            additionalProperties: false
          minItems: 1
          description: The new values to apply to the spreadsheet. Each ValueRange specifies a range and the values
            to write to that range. Multiple ranges can be updated in a single request.
        spreadsheet_id:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          description: The ID of the spreadsheet to update. This ID can be found in the URL of the spreadsheet (e.g.,
            https://docs.google.com/spreadsheets/d/{spreadsheet_id}/edit). Must be a valid Google Sheets spreadsheet
            ID.
        valueInputOption:
          enum:
          - INPUT_VALUE_OPTION_UNSPECIFIED
          - RAW
          - USER_ENTERED
          type: string
          description: 'How the input data should be interpreted. RAW: Values are stored exactly as entered, without
            parsing. USER_ENTERED: Values are parsed as if typed by a user (numbers stay numbers, strings prefixed
            with ''='' become formulas, etc.). INPUT_VALUE_OPTION_UNSPECIFIED: Default input value option is not specified.'
        includeValuesInResponse:
          type: boolean
          description: Determines if the update response should include the values of the cells that were updated.
            By default, responses do not include the updated values.
        responseValueRenderOption:
          enum:
          - FORMATTED_VALUE
          - UNFORMATTED_VALUE
          - FORMULA
          type: string
          description: 'Determines how values in the response should be rendered. Only used if includeValuesInResponse
            is true. FORMATTED_VALUE (default): Values are formatted as displayed in the UI. UNFORMATTED_VALUE: Values
            are unformatted. FORMULA: Formulas are not evaluated.'
        responseDateTimeRenderOption:
          enum:
          - SERIAL_NUMBER
          - FORMATTED_STRING
          type: string
          description: 'Determines how dates, times, and durations in the response should be rendered. Only used if
            includeValuesInResponse is true. SERIAL_NUMBER (default): Dates are returned as numbers. FORMATTED_STRING:
            Dates are returned as formatted strings.'
      additionalProperties: false
  - id: upsert_rows
    slug: GOOGLESHEETS_UPSERT_ROWS
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Upsert rows - update existing rows by key, append new ones. Automatically handles column mapping
      and partial updates.
    input_schema:
      type: object
      required:
      - spreadsheetId
      - sheetName
      - rows
      properties:
        rows:
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
          minItems: 1
          description: '2D array of data rows to upsert. IMPORTANT: If ''headers'' is NOT provided, the FIRST row
            is treated as column headers and remaining rows as data - so you need at least 2 rows (1 header + 1 data).
            If ''headers'' IS provided separately, then ALL rows in this array are treated as data rows. Each row
            should have the same number of values as headers. If a row has MORE values than headers: with strict_mode=true
            (default), an error is returned showing which rows are affected; with strict_mode=false, extra values
            are silently truncated. If a row has FEWER values than headers, an error is returned during execution.
            Cell values can be strings, numbers, booleans, or null. Example with headers provided: headers=[''Email'',''Status''],
            rows=[[''john@ex.com'',''Active'']] (1 data row). Example without headers: rows=[[''Email'',''Status''],[''john@ex.com'',''Active'']]
            (row 1 = headers, row 2 = data).'
        headers:
          type: array
          items:
            type: string
          description: 'List of column names for the data. These will be matched against sheet headers. If a column
            doesn''t exist in the sheet, it will be added automatically. Order doesn''t need to match sheet order.
            Can be auto-derived from the first row in ''rows'' if not provided. Example inputs: [''Email'', ''Phone'',
            ''Status''] for contact updates, [''Lead ID'', ''Name'', ''Score''] for CRM, [''SKU'', ''Stock'', ''Price'']
            for inventory.'
        keyColumn:
          type: string
          description: The column NAME (header text) to use as unique identifier for matching rows. Must be an actual
            header name from the sheet (e.g., 'Email', 'Lead ID', 'SKU'), NOT a column letter (e.g., 'A', 'B', 'C').
            If you provide a column letter like 'A', it will be automatically converted to the header name at that
            column position. If neither 'key_column' nor 'key_column_index' is provided, defaults to the first column
            (index 0).
        sheetName:
          type: string
          description: 'The name of the sheet/tab within the spreadsheet. Note: Google Sheets creates default sheets
            with localized names based on account language (e.g., ''Sheet1'' for English, ''工作表1'' for Chinese, ''Hoja1''
            for Spanish, ''Feuille1'' for French, ''Planilha1'' for Portuguese, ''Лист1'' for Russian). If you specify
            a common default name and the sheet is not found, the action will automatically use the first sheet if
            only one exists.'
        strictMode:
          type: boolean
          description: Controls how rows with mismatched column counts are handled. When True (default), an error
            is returned if any row has more values than headers - the error message shows exactly which rows are affected
            and what values would need to be removed. When False, extra values are silently truncated to match the
            header count. Set to False only if you explicitly want automatic truncation of extra values.
        tableStart:
          type: string
          description: Cell where the table starts (where headers are located). Defaults to 'A1'. Use this if your
            table is offset (e.g., 'C5', 'D10').
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet. Must be a non-empty string, typically a 44-character alphanumeric
            string found in the spreadsheet URL.
        key_column_index:
          anyOf:
          - type: integer
          - type: number
          description: 'The 0-based column index to use as unique identifier for matching rows. Alternative to ''key_column''
            - will be converted to column name using headers. If neither ''key_column'' nor ''key_column_index'' is
            provided, defaults to 0 (first column). Example: 0 for first column, 1 for second column.'
        normalization_message:
          type: string
          description: Internal field to track input normalization (e.g., row truncation). Not part of API.
      additionalProperties: false
  - id: get_spreadsheet_values
    slug: GOOGLESHEETS_VALUES_GET
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Returns a range of values from a spreadsheet. Use when you need to read data from specific cells
      or ranges in a Google Sheet.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - range
      properties:
        range:
          type: string
          description: 'The A1 notation or R1C1 notation of the range to retrieve values from. If the sheet name contains
            spaces or special characters, wrap the sheet name in single quotes (e.g., "''My Sheet''!A1:B2"). Without
            single quotes, the API will return a 400 error for sheet names with spaces. Examples: ''Sheet1!A1:B3'',
            "''Sheet With Spaces''!A1:D5", ''A1:D5'' (no sheet name uses first visible sheet), ''Sheet1!A:A'' (entire
            column), ''SheetName'' (entire sheet).'
        end_row:
          type: integer
          description: '1-based row number to stop reading at (inclusive). Use with start_row for pagination to avoid
            large response errors. Example: start_row=501, end_row=1000 fetches rows 501-1000.'
        start_row:
          type: integer
          description: '1-based row number to start reading from (inclusive). Use with end_row for pagination to avoid
            large response errors. Example: start_row=1, end_row=500 fetches the first 500 rows.'
        spreadsheet_id:
          type: string
          description: 'The unique identifier of the Google Spreadsheet from which to retrieve values. This is the
            long alphanumeric string found in the spreadsheet URL between ''/d/'' and ''/edit'' (e.g., ''1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms'').
            WARNING: Do NOT use the spreadsheet name or title (e.g., ''My Sales Report''); you must use the actual
            ID from the URL.'
        major_dimension:
          enum:
          - DIMENSION_UNSPECIFIED
          - ROWS
          - COLUMNS
          type: string
          description: The major dimension for results.
        value_render_option:
          enum:
          - FORMATTED_VALUE
          - UNFORMATTED_VALUE
          - FORMULA
          type: string
          description: 'How values should be rendered in the output. FORMATTED_VALUE: Values are calculated and formatted
            (default). UNFORMATTED_VALUE: Values are calculated but not formatted. FORMULA: Values are not calculated;
            the formula is returned instead.'
        date_time_render_option:
          enum:
          - SERIAL_NUMBER
          - FORMATTED_STRING
          type: string
          description: 'How dates, times, and durations should be represented in the output. SERIAL_NUMBER: Dates
            are returned as serial numbers (default). FORMATTED_STRING: Dates returned as formatted strings.'
      additionalProperties: false
  - id: update_cells
    slug: GOOGLESHEETS_VALUES_UPDATE
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to set values in a range of a Google Spreadsheet. Use when you need to update or overwrite existing
      cell values in a specific range.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - range
      - value_input_option
      - values
      properties:
        range:
          type: string
          description: 'The A1 notation of the range to update values in (e.g., ''Sheet1!A1:C2'', ''MySheet!C:C'',
            or ''A1:D5''). Wrap sheet names containing spaces or special characters in single quotes; escape an apostrophe
            within a quoted sheet name by doubling it (e.g., "''[Draft] Fall''''26''!A1:B2"). Must be actual cell
            references, not placeholder values. If the sheet name is omitted (e.g., ''A1:B2''), the operation applies
            to the first visible sheet. IMPORTANT: The range must not exceed the sheet''s grid dimensions. By default,
            new sheets have 1000 rows and 26 columns (A-Z). If you need to write to columns beyond Z (e.g., AA, AB),
            first expand the sheet using GOOGLESHEETS_APPEND_DIMENSION or check the current dimensions using GOOGLESHEETS_GET_SPREADSHEET_INFO.'
        values:
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
          description: The data to write. This is an array of arrays, the outer array representing all the data and
            each inner array representing a major dimension. Each item in the inner array corresponds with one cell.
        spreadsheet_id:
          type: string
          description: The unique identifier of the Google Spreadsheet to update. This ID can be found in the URL
            of the spreadsheet (e.g., https://docs.google.com/spreadsheets/d/{spreadsheet_id}/edit). Must be a non-empty
            string.
        major_dimension:
          enum:
          - ROWS
          - COLUMNS
          type: string
          description: The major dimension of the values. ROWS (default) means each inner array is a row of values.
            COLUMNS means each inner array is a column of values. Defaults to ROWS if unspecified.
        auto_expand_sheet:
          type: boolean
          description: If True (default), automatically expands the sheet's dimensions (adds columns/rows) when the
            target range exceeds the current grid limits. If False, the operation will fail with an error if the range
            exceeds grid limits.
        value_input_option:
          enum:
          - RAW
          - USER_ENTERED
          type: string
          description: 'How the input data should be interpreted. RAW: Values are stored exactly as entered, without
            parsing (dates, formulas, etc. remain as strings). USER_ENTERED: Values are parsed as if typed by a user
            (numbers stay numbers, strings prefixed with ''='' become formulas, etc.).'
        include_values_in_response:
          type: boolean
          description: Determines if the update response should include the values of the cells that were updated.
            By default, responses do not include the updated values.
        response_value_render_option:
          enum:
          - FORMATTED_VALUE
          - UNFORMATTED_VALUE
          - FORMULA
          type: string
          description: 'Determines how values in the response should be rendered. Only used if includeValuesInResponse
            is true. FORMATTED_VALUE (default): Values are formatted as displayed in the UI. UNFORMATTED_VALUE: Values
            are unformatted (numbers, booleans, formulas). FORMULA: Formulas are not evaluated and remain as text.'
        response_datetime_render_option:
          enum:
          - SERIAL_NUMBER
          - FORMATTED_STRING
          type: string
          description: 'Determines how dates, times, and durations in the response should be rendered. Only used if
            includeValuesInResponse is true. SERIAL_NUMBER (default): Dates are returned as numbers. FORMATTED_STRING:
            Dates are returned as strings formatted per the cell''s locale.'
      additionalProperties: false

defaults: {read: permit, write: require_approval, delete: deny, money: deny}
