kind: connector
key: googlesheets
app: Google Sheets
toolkit: googlesheets

tools:
  - id: append_rows
    slug: GOOGLESHEETS_SPREADSHEETS_VALUES_APPEND
    version: "20261001_00"
    action_class: write
    capability: sheets.write
    description: Append rows after the last row of a table in a spreadsheet.
    input_schema:
      type: object
      additionalProperties: false
      required: [spreadsheetId, range, valueInputOption, values]
      properties:
        spreadsheetId:
          type: string
          minLength: 30
          pattern: ^[a-zA-Z0-9_-]+$
          description: The spreadsheet id from its URL.
        range:
          type: string
          description: A1 notation of the table to append to, such as Reconciliation!A:F.
        valueInputOption:
          type: string
          enum: [RAW, USER_ENTERED]
          description: RAW stores values as given; USER_ENTERED parses them as if typed.
        values:
          type: array
          description: Rows to append. Each inner array is one row.
          items:
            type: array
            items: {type: [string, number, boolean, "null"]}

  - id: read_rows
    slug: GOOGLESHEETS_BATCH_GET
    version: "20261001_00"
    action_class: read
    capability: sheets.read
    description: Read the values in one or more ranges of a spreadsheet, row by row.
    input_schema:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, ranges]
      properties:
        spreadsheet_id:
          type: string
          minLength: 30
          maxLength: 200
          pattern: ^[a-zA-Z0-9_-]+$
          description: The spreadsheet id from its URL.
        ranges:
          type: array
          minItems: 1
          maxItems: 5
          items: {type: string, minLength: 1}
          description: Ranges in A1 notation, such as Expenses!A:E.

  # Imported from Composio by scripts/import_connector.py googlesheets; reviewed choices are in
  # scripts/connector_imports/googlesheets.yaml.
  - id: add_sheet
    slug: GOOGLESHEETS_ADD_SHEET
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Add a GRID sheet with rows and columns to an existing spreadsheet. This action does not create chart-only
      or DATA_SOURCE sheets. Use properties to configure the GRID sheet's dimensions, tab color, position, visibility,
      and text direction.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      properties:
        title:
          type: string
          description: 'The name for the new sheet tab. Must be unique within the spreadsheet. Example: "Q3 Report",
            "Sales Data 2025". This is a convenience parameter - alternatively, you can set this via properties.title.
            Note: sheet_name is also accepted as an alias for title.'
        properties:
          type: object
          properties:
            index:
              type: integer
              minimum: 0
              description: 'The zero-based index where the sheet should be inserted. Must be less than or equal to
                the current number of sheets. If not set, the sheet will be added at the end. Example: 0 for the first
                position. CONCURRENCY WARNING: Do not use ''index'' when creating multiple sheets in parallel - this
                causes ''index is too high'' errors. For parallel creation, omit this field and let sheets be added
                at the end.'
            title:
              type: string
              description: 'The name of the sheet. Must be unique within the spreadsheet. Example: "Q3 Report", "Sales
                Data 2025"'
            hidden:
              type: boolean
              description: True if the sheet is hidden in the UI, false if it's visible.
            sheetId:
              type: integer
              minimum: 0
              description: 'The ID of the sheet. If not set, an ID will be randomly generated. Must be non-negative
                and unique within the spreadsheet. WARNING: Avoid setting this unless you need a specific ID.'
            sheetType:
              enum:
              - GRID
              type: string
              description: The only sheet type accepted by GOOGLESHEETS_ADD_SHEET.
            rightToLeft:
              type: boolean
              description: True if the sheet is an RTL sheet, false if it's LTR.
            tabColorStyle:
              anyOf:
              - type: object
                required:
                - rgbColor
                properties:
                  rgbColor:
                    type: object
                    properties:
                      red:
                        anyOf:
                        - type: number
                          maximum: 1
                          minimum: 0
                        - type: 'null'
                        description: The amount of red in the color as a value in the interval [0, 1].
                      blue:
                        anyOf:
                        - type: number
                          maximum: 1
                          minimum: 0
                        - type: 'null'
                        description: The amount of blue in the color as a value in the interval [0, 1].
                      alpha:
                        anyOf:
                        - type: number
                          maximum: 1
                          minimum: 0
                        - type: 'null'
                        description: The fraction of this color that should be applied to the pixel. E.g. 0.5 for
                          50% transparent.
                      green:
                        anyOf:
                        - type: number
                          maximum: 1
                          minimum: 0
                        - type: 'null'
                        description: The amount of green in the color as a value in the interval [0, 1].
                    description: RGB color. Provide values for red, green, blue (0.0-1.0).
                    additionalProperties: false
                additionalProperties: false
              - type: object
                required:
                - themeColor
                properties:
                  themeColor:
                    enum:
                    - THEME_COLOR_TYPE_UNSPECIFIED
                    - TEXT
                    - BACKGROUND
                    - ACCENT1
                    - ACCENT2
                    - ACCENT3
                    - ACCENT4
                    - ACCENT5
                    - ACCENT6
                    - LINK
                    type: string
                    description: Theme color. Use predefined theme colors like ACCENT1, TEXT, BACKGROUND, etc.
                additionalProperties: false
              description: 'Either {rgbColor: {...}} or {themeColor: "..."}, never both.'
            gridProperties:
              type: object
              properties:
                rowCount:
                  type: integer
                  minimum: 0
                  description: The number of rows in the sheet. Defaults to 100 rows if not specified (to conserve
                    cell quota). Google Sheets has a 10M cell workbook limit.
                columnCount:
                  type: integer
                  minimum: 0
                  description: The number of columns in the sheet. Defaults to 26 columns if not specified. Google
                    Sheets has a 10M cell workbook limit.
                hideGridlines:
                  type: boolean
                  description: True if the gridlines are hidden, false if they are shown.
                frozenRowCount:
                  type: integer
                  minimum: 0
                  description: The number of rows that are frozen in the sheet.
                frozenColumnCount:
                  type: integer
                  minimum: 0
                  description: The number of columns that are frozen in the sheet.
                rowGroupControlAfter:
                  type: boolean
                  description: True if the row group control toggle is shown after the group, false if before.
                columnGroupControlAfter:
                  type: boolean
                  description: True if the column group control toggle is shown after the group, false if before.
              description: Grid dimensions and display settings for the new GRID sheet.
              additionalProperties: false
          description: Advanced GRID sheet properties such as dimensions, tab color, position, visibility, and text
            direction. For simple cases, use the title parameter directly.
          additionalProperties: false
        force_unique:
          type: boolean
          description: When True (default), automatically ensures the sheet name is unique by appending a numeric
            suffix (e.g., '_2', '_3') if the requested name already exists. This makes the action resilient to retries
            and parallel workflows. When False, the action fails with an error if a sheet with the same name already
            exists.
        spreadsheet_id:
          type: string
          minLength: 1
          description: REQUIRED. Cannot be empty. The ID of the target spreadsheet where the new sheet will be added.
            This is the long alphanumeric string in the Google Sheet URL (e.g., '1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms').
            Use 'Search Spreadsheets' action to find the spreadsheet ID by name if you don't have it.
      additionalProperties: false
  - id: aggregate_column_data
    slug: GOOGLESHEETS_AGGREGATE_COLUMN_DATA
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Searches for rows where a specific column matches a value and performs mathematical operations on
      data from another column.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - sheet_name
      - target_column
      - operation
      properties:
        operation:
          enum:
          - sum
          - average
          - count
          - min
          - max
          - percentage
          type: string
          description: The mathematical operation to perform on the target column values.
        sheet_name:
          type: string
          description: The name of the specific sheet within the spreadsheet. Matching is case-insensitive. If no
            exact match is found, partial matches will be attempted (e.g., 'overview' will match 'Overview 2025').
        search_value:
          type: string
          description: The exact value to search for in the search column. Case-sensitive by default. If not provided
            (or if search_column is not provided), all rows in the target column will be aggregated without filtering.
        search_column:
          type: string
          description: The column to search in for filtering rows. Can be a letter (e.g., 'A', 'B') or column name
            from header row (e.g., 'Region', 'Department'). If not provided, all rows in the target column will be
            aggregated without filtering.
        target_column:
          type: string
          description: The column to aggregate data from. Can be a letter (e.g., 'C', 'D') or column name from header
            row (e.g., 'Sales', 'Revenue').
        case_sensitive:
          type: boolean
          description: Whether the search should be case-sensitive.
        has_header_row:
          type: boolean
          description: Whether the first row contains column headers. If True, column names can be used for search_column
            and target_column.
        spreadsheet_id:
          type: string
          description: The unique identifier of the Google Sheets spreadsheet.
        percentage_total:
          type: number
          description: For percentage operation, the total value to calculate percentage against. If not provided,
            uses sum of all values in target column.
        additional_filters:
          type: array
          items:
            type: object
            required:
            - column
            - value
            properties:
              value:
                type: string
                description: Exact value to match in the column.
              column:
                type: string
                description: Column letter (e.g., 'B') or header name (e.g., 'Region') to filter on.
            description: An extra column=value filter applied with AND logic on top of search_column/search_value.
            additionalProperties: false
          description: 'Extra column=value conditions applied with AND logic on top of search_column/search_value.
            Use this to filter on multiple columns simultaneously. Example: [{"column": "Region", "value": "APAC"}]
            combined with search_column=Product/search_value=Beacon returns only rows where Product=Beacon AND Region=APAC.'
      additionalProperties: false
  - id: append_dimension
    slug: GOOGLESHEETS_APPEND_DIMENSION
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to append new rows or columns to a sheet, increasing its size. Use when you need to add empty
      rows or columns to an existing sheet.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - sheet_id
      - dimension
      - length
      properties:
        length:
          type: integer
          description: The number of rows or columns to append.
        sheet_id:
          type: integer
          description: The numeric ID of the sheet (not the sheet name). This is a non-negative integer found in the
            sheet's URL as the 'gid' parameter (e.g., gid=0) or in the sheet properties. The first sheet in a spreadsheet
            typically has sheet_id=0.
        dimension:
          enum:
          - ROWS
          - COLUMNS
          type: string
          description: Specifies whether to append rows or columns.
        spreadsheet_id:
          type: string
          description: The ID of the spreadsheet.
        response_ranges:
          type: array
          items:
            type: string
          description: Limits the ranges of the spreadsheet to include in the response.
        response_include_grid_data:
          type: boolean
          description: True if grid data should be included in the response (if includeSpreadsheetInResponse is true).
        include_spreadsheet_in_response:
          type: boolean
          description: True if the updated spreadsheet should be included in the response.
      additionalProperties: false
  - id: auto_resize_rows_or_columns
    slug: GOOGLESHEETS_AUTO_RESIZE_DIMENSIONS
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Auto-fit column widths or row heights for a dimension range using batchUpdate.autoResizeDimensions.
      Use when you need to automatically adjust row heights or column widths to fit content after writing data.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - dimension
      - start_index
      - end_index
      properties:
        sheet_id:
          type: integer
          description: The numeric ID of the sheet to resize. Either sheet_id or sheet_name must be provided. If both
            are provided, sheet_name takes precedence and will be resolved to sheet_id.
        dimension:
          enum:
          - ROWS
          - COLUMNS
          type: string
          description: The dimension to auto-resize. Use 'ROWS' to auto-fit row heights or 'COLUMNS' to auto-fit column
            widths.
        end_index:
          type: integer
          minimum: 1
          description: The zero-based end index of the dimension range to resize (exclusive). Must be greater than
            start_index. For example, to resize columns A-C, use start_index=0 and end_index=3.
        sheet_name:
          type: string
          description: The name of the sheet to resize. Either sheet_id or sheet_name must be provided. Using sheet_name
            is recommended as it's more intuitive. If both sheet_id and sheet_name are provided, sheet_name takes
            precedence.
        start_index:
          type: integer
          minimum: 0
          description: The zero-based start index of the dimension range to resize (inclusive). For columns, 0 = column
            A. For rows, 0 = row 1.
        spreadsheet_id:
          type: string
          description: The ID of the spreadsheet containing the sheet to resize.
      additionalProperties: false
  - id: batch_update_values_by_data_filter
    slug: GOOGLESHEETS_BATCH_UPDATE_VALUES_BY_DATA_FILTER
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to update values in ranges matching data filters. Use when you need to update specific data
      in a Google Sheet based on criteria rather than fixed cell ranges.
    input_schema:
      type: object
      required:
      - spreadsheetId
      - data
      - valueInputOption
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - dataFilter
            - values
            properties:
              values:
                type: array
                items:
                  type: array
                  items:
                    anyOf:
                    - type: string
                    - type: integer
                    - type: number
                    - type: boolean
                description: The data to be written. A two-dimensional array of values that will be written to the
                  range. Values can be strings, numbers, or booleans. If the range is larger than the values array,
                  the excess cells will not be changed. If the values array is larger than the range, the excess values
                  will be ignored.
              dataFilter:
                type: object
                properties:
                  a1Range:
                    type: string
                    description: The A1 notation of the range to update.
                  gridRange:
                    type: object
                    properties:
                      sheetId:
                        type: integer
                        description: The sheet this range is on.
                      endRowIndex:
                        type: integer
                        description: The end row (exclusive) of the range, or not set if unbounded.
                      startRowIndex:
                        type: integer
                        description: The start row (inclusive) of the range, or not set if unbounded.
                      endColumnIndex:
                        type: integer
                        description: The end column (exclusive) of the range, or not set if unbounded.
                      startColumnIndex:
                        type: integer
                        description: The start column (inclusive) of the range, or not set if unbounded.
                    description: Selects data within the range described by a GridRange. This field is optional. If
                      specified, the dataFilter selects data within the specified grid range.
                    additionalProperties: false
                  developerMetadataLookup:
                    type: object
                    properties:
                      metadataId:
                        type: integer
                        description: The ID of the developer metadata to match. This field is optional. If specified,
                          the lookup matches only the developer metadata with the specified ID.
                      visibility:
                        type: string
                        description: The visibility of the developer metadata to match. This field is optional. If
                          specified, the lookup matches only the developer metadata with the specified visibility.
                      metadataKey:
                        type: string
                        description: The key of the developer metadata to match. This field is optional. If specified,
                          the lookup matches only the developer metadata with the specified key.
                      locationType:
                        enum:
                        - ROW
                        - COLUMN
                        - SHEET
                        type: string
                        description: The type of location this object is looking for. Valid values are ROW, COLUMN,
                          and SHEET.
                      metadataValue:
                        type: string
                        description: The value of the developer metadata to match. This field is optional. If specified,
                          the lookup matches only the developer metadata with the specified value.
                      metadataLocation:
                        type: object
                        properties:
                          sheetId:
                            type: integer
                            description: The ID of the sheet the location is on.
                          spreadsheet:
                            type: boolean
                            description: True if the metadata location is the spreadsheet itself.
                          locationType:
                            type: string
                            description: The type of location this object represents. This field is read-only.
                          dimensionRange:
                            type: object
                            description: 'A range along a single dimension on a sheet. All indexes are 0-based. Indexes
                              are half open: the start index is inclusive and the end index is exclusive. Missing
                              indexes indicate the range is unbounded on that side.'
                            additionalProperties: true
                        description: The location of the developer metadata to match. This field is optional. If specified,
                          the lookup matches only the developer metadata in the specified location.
                        additionalProperties: false
                      locationMatchingStrategy:
                        enum:
                        - EXACT
                        - INTERSECTING
                        type: string
                        description: Determines how this lookup matches the location. If this field is specified as
                          EXACT, then the lookup requires an exact match of the specified locationType, metadataKey,
                          and metadataValue. If this field is specified as INTERSECTING, then the lookup considers
                          all metadata that intersects the specified locationType, and then filters that metadata
                          by the specified key and value. If this field is unspecified, it is treated as EXACT.
                    description: Matches the data against the developer metadata that's associated with the dimensions.
                      The developer metadata should be created with the location type set to either ROW or COLUMN
                      and the visibility set to DOCUMENT.
                    additionalProperties: false
                description: The data filter describing the criteria to select cells for update.
                additionalProperties: false
              majorDimension:
                enum:
                - ROWS
                - COLUMNS
                - DIMENSION_UNSPECIFIED
                type: string
                description: The major dimension of the values. The default value is ROWS.
            additionalProperties: false
          description: The new values to apply to the spreadsheet. If more than one range is matched by the specified
            DataFilter the specified values are applied to all of those ranges. Can be provided as a JSON string or
            as a list of DataFilterValueRange objects.
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet to update.
        valueInputOption:
          enum:
          - INPUT_VALUE_OPTION_UNSPECIFIED
          - RAW
          - USER_ENTERED
          type: string
          description: 'How the input data should be interpreted. RAW: Values are stored exactly as entered, without
            parsing. USER_ENTERED: Values are parsed as if typed by a user (numbers stay numbers, strings prefixed
            with ''='' become formulas, etc.). INPUT_VALUE_OPTION_UNSPECIFIED: Default input value option is not specified.'
        includeValuesInResponse:
          type: boolean
          description: Determines if the update response should include the values of the cells that were updated.
            By default, responses do not include the updated values.
        responseValueRenderOption:
          enum:
          - FORMATTED_VALUE
          - UNFORMATTED_VALUE
          - FORMULA
          type: string
          description: Determines how values in the response should be rendered. The default render option is FORMATTED_VALUE.
        responseDateTimeRenderOption:
          enum:
          - SERIAL_NUMBER
          - FORMATTED_STRING
          type: string
          description: Determines how dates, times, and durations in the response should be rendered. This is ignored
            if responseValueRenderOption is FORMATTED_VALUE. The default dateTime render option is SERIAL_NUMBER.
      additionalProperties: false
  - id: create_chart
    slug: GOOGLESHEETS_CREATE_CHART
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Create a chart in a Google Sheets spreadsheet using the specified data range and chart type.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - sheet_id
      - chart_type
      - data_range
      properties:
        title:
          type: string
          description: Optional title for the chart.
        sheet_id:
          type: integer
          description: 'The numeric sheetId (not the sheet name/title) of the worksheet where the chart will be created.
            This is a unique integer identifier for the sheet within the spreadsheet. The first/default sheet typically
            has sheetId=0. IMPORTANT: Use ''Get Spreadsheet Info'' action to retrieve valid sheetIds - look for sheets[].properties.sheetId
            in the response. The sheetId must exist in the target spreadsheet; using an ID from a different spreadsheet
            will fail.'
        subtitle:
          type: string
          description: Optional subtitle for the chart.
        chart_spec:
          type: object
          description: 'Optional full ChartSpec object to send to the Google Sheets API. Use this to support ALL chart
            types and advanced options. Must set exactly one of: basicChart, pieChart, bubbleChart, candlestickChart,
            histogramChart, treemapChart, waterfallChart, orgChart, scorecardChart. See https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/charts#ChartSpec.'
          additionalProperties: true
        chart_type:
          type: string
          description: 'Type of chart to create. Supported types: BAR, LINE, AREA, COLUMN, SCATTER, COMBO, STEPPED_AREA,
            PIE, HISTOGRAM, BUBBLE, CANDLESTICK, TREEMAP, WATERFALL, ORG, SCORECARD. Case-insensitive and whitespace-tolerant.'
        data_range:
          type: string
          description: 'A single contiguous range of data for the chart in A1 notation (e.g., ''A1:C10'' or ''Sheet1!B2:D20'').
            Must be a single continuous range - comma-separated multi-ranges (e.g., ''A1:A10,C1:C10'') are not supported.
            When chart_spec is not provided, the first column is used as the domain/labels and the remaining columns
            as series. IMPORTANT: PIE charts require at least 2 columns - the first column for category labels (domain)
            and the second column for numeric values (series). Single-column ranges are not supported for PIE charts.'
        x_axis_title:
          type: string
          description: Optional title for the X-axis.
        y_axis_title:
          type: string
          description: Optional title for the Y-axis.
        background_red:
          type: number
          description: Red component of chart background color (0.0-1.0). If not specified, uses default.
        spreadsheet_id:
          type: string
          description: 'The unique identifier of the Google Sheets spreadsheet where the chart will be created. Must
            be the actual spreadsheet ID from the URL (e.g., ''1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms''), NOT
            the spreadsheet name or title. Find it in the URL: https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit'
        background_blue:
          type: number
          description: Blue component of chart background color (0.0-1.0). If not specified, uses default.
        legend_position:
          type: string
          description: 'Position of the chart legend. Options: BOTTOM_LEGEND, TOP_LEGEND, LEFT_LEGEND, RIGHT_LEGEND,
            NO_LEGEND.'
        background_green:
          type: number
          description: Green component of chart background color (0.0-1.0). If not specified, uses default.
      additionalProperties: false
  - id: create_google_sheet
    slug: GOOGLESHEETS_CREATE_GOOGLE_SHEET1
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Creates a new Google Spreadsheet in the connected account's Drive, named by title (Google names it
      'Untitled spreadsheet' without one).
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: The title for the new Google Sheet. If omitted, Google will create a spreadsheet with a default
            name like 'Untitled spreadsheet'.
      additionalProperties: false
  - id: create_spreadsheet_column
    slug: GOOGLESHEETS_CREATE_SPREADSHEET_COLUMN
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Creates a new column in a Google Spreadsheet. Specify the target sheet using sheet_id (numeric) or
      sheet_name (text). If neither is provided, defaults to the first sheet (sheet_id=0).
    input_schema:
      type: object
      required:
      - spreadsheet_id
      properties:
        sheet_id:
          type: integer
          description: The numeric identifier of the specific sheet (tab) within the spreadsheet. Defaults to 0 (the
            first sheet) if neither sheet_id nor sheet_name is provided. Use GOOGLESHEETS_GET_SHEET_NAMES or GOOGLESHEETS_FIND_WORKSHEET_BY_TITLE
            to obtain the sheet_id from a sheet name.
        sheet_name:
          type: string
          description: The name (title) of the sheet/tab where the column will be added. If provided, the action will
            look up the sheet_id automatically. If both sheet_id and sheet_name are provided, sheet_id takes precedence.
        insert_index:
          type: integer
          description: The 0-based index at which the new column will be inserted. For example, an index of 0 inserts
            the column before the current first column (A), and an index of 1 inserts it between the current columns
            A and B.
        spreadsheet_id:
          type: string
          description: The unique identifier of the Google Spreadsheet where the column will be created.
        response_ranges:
          type: array
          items:
            type: string
          description: Limits the ranges of the spreadsheet to include in the response. Only used if includeSpreadsheetInResponse
            is true.
        inherit_from_before:
          type: boolean
          description: If true, the new column inherits properties (e.g., formatting, width) from the column immediately
            to its left (the preceding column). If false (default), it inherits from the column immediately to its
            right (the succeeding column). This is ignored if there is no respective preceding or succeeding column.
        response_include_grid_data:
          type: boolean
          description: If true, grid data will be included in the response (only used if includeSpreadsheetInResponse
            is true).
        include_spreadsheet_in_response:
          type: boolean
          description: If true, the updated spreadsheet will be included in the response. Defaults to true if not
            specified.
      additionalProperties: false
  - id: create_spreadsheet_row
    slug: GOOGLESHEETS_CREATE_SPREADSHEET_ROW
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Inserts a new, empty row into a specified sheet of a Google Spreadsheet at a given index, optionally
      inheriting formatting from the row above.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      properties:
        sheet_id:
          type: integer
          description: The numeric identifier of the sheet (tab) within the spreadsheet where the row will be inserted.
            This ID (gid) is found in the URL of the spreadsheet (e.g., '0' for the first sheet). Either sheet_id
            or sheet_name must be provided.
        sheet_name:
          type: string
          description: The human-readable name of the sheet (tab) within the spreadsheet where the row will be inserted
            (e.g., 'Sheet1'). Either sheet_id or sheet_name must be provided. If both are provided, sheet_id takes
            precedence.
        insert_index:
          type: integer
          description: The 0-based index at which the new row should be inserted. For example, an index of 0 inserts
            the row at the beginning of the sheet. If the index is greater than the current number of rows, the row
            is appended.
        spreadsheet_id:
          type: string
          description: The unique identifier of the Google Spreadsheet. Can be provided as the ID (e.g., '1qpyC0XzHc_-_d824s2VfopkHh7D0jW4aXCS1D_AlGA')
            or as a full URL (the ID will be extracted automatically).
        response_ranges:
          type: array
          items:
            type: string
          description: Limits the ranges included in the response spreadsheet. Only meaningful when include_spreadsheet_in_response
            is True. Use A1 notation (e.g., ['Sheet1!A1:D10']).
        inherit_from_before:
          type: boolean
          description: If True, the newly inserted row will inherit formatting and properties from the row immediately
            preceding its insertion point. If False, it will have default formatting.
        response_include_grid_data:
          type: boolean
          description: If True, grid data will be included in the response spreadsheet. Only meaningful when include_spreadsheet_in_response
            is True. Default is False.
        include_spreadsheet_in_response:
          type: boolean
          description: If True, the response will include the full updated Spreadsheet resource. Default behavior
            includes the spreadsheet when this parameter is not specified.
      additionalProperties: false
  - id: export_drive_spreadsheet
    slug: GOOGLESHEETS_EXPORT_DRIVE_FILE
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Export an entire native spreadsheet as XLSX, ODS, PDF, ZIP, CSV, or TSV; use Export Sheet as PDF
      for print layout and range controls.
    input_schema:
      type: object
      required:
      - file_id
      - mime_type
      properties:
        file_id:
          type: string
          minLength: 1
          description: Opaque Drive file ID of a native Google Sheets spreadsheet, not its title or URL.
        mime_type:
          enum:
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.oasis.opendocument.spreadsheet
          - application/pdf
          - application/zip
          - text/csv
          - text/tab-separated-values
          type: string
          description: 'Official Drive export MIME type for spreadsheets: XLSX, ODS, PDF, zipped HTML, CSV, or TSV.
            CSV and TSV export only the first sheet.'
      additionalProperties: false
  - id: export_sheet_as_pdf
    slug: GOOGLESHEETS_EXPORT_SHEET_AS_PDF
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Render one sheet tab or rectangular range as PDF with orientation, gridline, margin, and fit-to-width
      controls.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - sheet_id
      properties:
        portrait:
          type: boolean
          description: Whether to use portrait orientation, mapped to portrait.
        sheet_id:
          type: integer
          minimum: 0
          description: Numeric ID of the sheet tab to export (the gid in a Sheets URL), not the tab title or spreadsheet
            ID.
        top_margin:
          type: number
          minimum: 0
          description: Top margin passed to the sample-backed top_margin control. Google does not formally document
            its unit or accepted range.
        left_margin:
          type: number
          minimum: 0
          description: Left margin passed to the sample-backed left_margin control. Google does not formally document
            its unit or accepted range.
        fit_to_width:
          type: boolean
          description: Value for the sample-backed fitw PDF print control.
        print_titles:
          type: boolean
          description: Value for the sample-backed printtitle PDF print control.
        right_margin:
          type: number
          minimum: 0
          description: Right margin passed to the sample-backed right_margin control. Google does not formally document
            its unit or accepted range.
        bottom_margin:
          type: number
          minimum: 0
          description: Bottom margin passed to the sample-backed bottom_margin control. Google does not formally document
            its unit or accepted range.
        end_row_index:
          type: integer
          minimum: 1
          description: Sample-backed r2 range control. It must exceed start_row_index; Google does not formally document
            this browser-route key.
        show_gridlines:
          type: boolean
          description: Whether to show sheet gridlines in the PDF.
        spreadsheet_id:
          type: string
          minLength: 1
          description: Google Sheets spreadsheet ID or original docs.google.com Sheets URL, not the spreadsheet title.
            Published /d/e/ URLs are not supported.
        show_sheet_name:
          type: boolean
          description: Whether to print the sheet name, mapped to sheetnames.
        start_row_index:
          type: integer
          minimum: 0
          description: Sample-backed r1 range control. Supply it with all other range indices; Google does not formally
            document this browser-route key.
        end_column_index:
          type: integer
          minimum: 1
          description: Sample-backed c2 range control. It must exceed start_column_index; Google does not formally
            document this browser-route key.
        repeat_frozen_rows:
          type: boolean
          description: Value for the sample-backed fzr PDF print control.
        start_column_index:
          type: integer
          minimum: 0
          description: Sample-backed c1 range control. Supply it with all other range indices; Google does not formally
            document this browser-route key.
      additionalProperties: false
  - id: find_and_replace_in_spreadsheet
    slug: GOOGLESHEETS_FIND_REPLACE
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to find and replace text in a Google Spreadsheet. Use when you need to fix formula errors, update
      values, or perform bulk text replacements across cells.
    input_schema:
      type: object
      required:
      - spreadsheetId
      - find
      - replace
      properties:
        find:
          type: string
          description: The text to find. Can be a literal string or a regular expression pattern.
        range:
          type: string
          description: A1 notation range string to search within (e.g., 'A1:B10', 'Sheet1!A1:B10'). When using A1
            notation with a sheet name, you must also provide range_sheet_id to specify the numeric sheet ID (the
            API requires numeric IDs). Alternatively, use the GridRange parameters (range_sheet_id with optional row/column
            indices) for explicit numeric control. Mutually exclusive with sheet_id and all_sheets.
        replace:
          type: string
          description: The text to replace the found instances with.
        sheetId:
          type: integer
          description: 'The numeric ID of the sheet to search the entire sheet (e.g., 0 for the first sheet). Mutually
            exclusive with sheet_name, range/range_sheet_id parameters, and all_sheets. You must specify exactly one
            scope: either sheet_id (entire sheet), sheet_name, range/range_sheet_id (specific range), or all_sheets.'
        allSheets:
          type: boolean
          description: Whether to search across all sheets in the spreadsheet. Mutually exclusive with sheet_id and
            range parameters.
        matchCase:
          type: boolean
          description: Whether the search should be case-sensitive.
        sheetName:
          type: string
          description: The name/title of the sheet (tab) to search within (e.g., 'Sheet1', 'Sales Data'). The sheet
            name will be resolved to its numeric sheet ID. Mutually exclusive with sheet_id, range/range_sheet_id
            parameters, and all_sheets.
        endRowIndex:
          type: integer
          description: The end row (0-indexed, exclusive) of the range. Only used when range_sheet_id is provided
            without a 'range' parameter.
        rangeSheetId:
          type: integer
          description: The numeric sheet ID for a GridRange-based search. Required when using the 'range' parameter
            with A1 notation. Can also be used alone or with row/column index parameters to define a specific range.
            Mutually exclusive with sheet_id and all_sheets.
        searchByRegex:
          type: boolean
          description: Whether to treat the find text as a regular expression.
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet to update.
        startRowIndex:
          type: integer
          description: The start row (0-indexed, inclusive) of the range. Only used when range_sheet_id is provided
            without a 'range' parameter.
        endColumnIndex:
          type: integer
          description: The end column (0-indexed, exclusive) of the range. Column A = 0, B = 1, etc. Only used when
            range_sheet_id is provided without a 'range' parameter.
        includeFormulas:
          type: boolean
          description: Whether to include cells with formulas in the search. If true, formulas are searched and can
            be replaced. If false, only cell values (not formulas) are searched. If not specified, the default API
            behavior applies (both formulas and values are searched).
        matchEntireCell:
          type: boolean
          description: Whether to match only cells that contain the entire search term.
        startColumnIndex:
          type: integer
          description: The start column (0-indexed, inclusive) of the range. Column A = 0, B = 1, etc. Only used when
            range_sheet_id is provided without a 'range' parameter.
      additionalProperties: false
  - id: format_cell
    slug: GOOGLESHEETS_FORMAT_CELL
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Applies text and background cell formatting to a specified range in a Google Sheets worksheet.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      properties:
        red:
          type: number
          maximum: 1
          minimum: 0
          description: Red component of the background color (0.0-1.0).
        blue:
          type: number
          maximum: 1
          minimum: 0
          description: Blue component of the background color (0.0-1.0).
        bold:
          type: boolean
          description: Apply bold formatting.
        green:
          type: number
          maximum: 1
          minimum: 0
          description: Green component of the background color (0.0-1.0).
        range:
          type: string
          description: 'OPTION 1: Cell range in A1 notation (RECOMMENDED). Supports: single cells (''A1'', ''F9''),
            cell ranges (''A1:B5''), entire columns (''A'', ''I:J''), entire rows (''1'', ''1:5''). Also accepts sheet-prefixed
            ranges (''Sheet1!A1'', ''Instagram Calendar!A1:E1'') for convenience - if provided, the sheet prefix is
            stripped and ignored. The actual sheet used is determined by the sheet_name or worksheet_id parameter.
            Provide EITHER this field OR all four index fields below, not both.'
        italic:
          type: boolean
          description: Apply italic formatting.
        fontSize:
          type: integer
          minimum: 1
          description: Font size in points.
        text_link:
          type: string
          description: Cell-level text link URI. Must include a URI scheme, such as 'https://' or 'mailto:'.
        underline:
          type: boolean
          description: Apply underline formatting.
        sheet_name:
          type: string
          description: The worksheet name/title (e.g., 'Sheet1', 'Q3 Report'). Provide either this field OR worksheet_id,
            not both. If both are provided, sheet_name takes precedence and will be resolved to worksheet_id.
        text_color:
          type: string
          description: Text color as 6-digit hex.
        font_family:
          type: string
          description: Font family.
        padding_top:
          type: integer
          minimum: 0
          description: Top padding in pixels.
        border_color:
          type: string
          description: Border color as 6-digit hex.
        border_style:
          enum:
          - DOTTED
          - DASHED
          - SOLID
          - SOLID_MEDIUM
          - SOLID_THICK
          - NONE
          - DOUBLE
          type: string
          description: Border styles supported by Google Sheets.
        padding_left:
          type: integer
          minimum: 0
          description: Left padding in pixels.
        worksheet_id:
          type: integer
          description: 'The worksheet identifier. Accepts EITHER: (1) The sheetId from the Google Sheets API (a large
            number like 1534097477, obtainable via GOOGLESHEETS_GET_SPREADSHEET_INFO), OR (2) The 0-based positional
            index of the worksheet (0 for first sheet, 1 for second, etc.). The action will first try to match by
            sheetId, then fall back to matching by index. Defaults to 0 (first sheet). Provide either this field OR
            sheet_name, not both.'
        end_row_index:
          type: integer
          description: 'OPTION 2: 0-based index of the row AFTER the last row (exclusive). Required if ''range'' is
            not provided. Must provide ALL four index fields together.'
        padding_right:
          type: integer
          minimum: 0
          description: Right padding in pixels.
        strikethrough:
          type: boolean
          description: Apply strikethrough formatting.
        wrap_strategy:
          enum:
          - OVERFLOW_CELL
          - LEGACY_WRAP
          - CLIP
          - WRAP
          type: string
          description: How text wraps within cells.
        padding_bottom:
          type: integer
          minimum: 0
          description: Bottom padding in pixels.
        spreadsheet_id:
          type: string
          description: Identifier of the Google Sheets spreadsheet.
        text_direction:
          enum:
          - LEFT_TO_RIGHT
          - RIGHT_TO_LEFT
          type: string
          description: Text direction in a cell.
        start_row_index:
          type: integer
          description: 'OPTION 2: 0-based row index (row 1 = index 0, row 9 = index 8). Required if ''range'' is not
            provided. Must provide ALL four index fields together.'
        background_alpha:
          type: number
          maximum: 1
          minimum: 0
          description: Background alpha from 0.0 to 1.0.
        background_color:
          type: string
          description: Background color as 6-digit hex.
        end_column_index:
          type: integer
          description: 'OPTION 2: 0-based index of the column AFTER the last column (exclusive). Required if ''range''
            is not provided. Must provide ALL four index fields together.'
        number_format_type:
          enum:
          - TEXT
          - NUMBER
          - PERCENT
          - CURRENCY
          - DATE
          - TIME
          - DATE_TIME
          - SCIENTIFIC
          type: string
          description: How number values should be represented to the user.
        start_column_index:
          type: integer
          description: 'OPTION 2: 0-based column index (A = 0, B = 1, F = 5). Required if ''range'' is not provided.
            Must provide ALL four index fields together.'
        vertical_alignment:
          enum:
          - TOP
          - MIDDLE
          - BOTTOM
          type: string
          description: Vertical alignment of text in a cell.
        text_rotation_angle:
          type: integer
          maximum: 90
          minimum: -90
          description: Text rotation angle from -90 to 90.
        horizontal_alignment:
          enum:
          - LEFT
          - CENTER
          - RIGHT
          type: string
          description: Horizontal alignment of text in a cell.
        number_format_pattern:
          type: string
          description: Optional number/date pattern.
        hyperlink_display_type:
          enum:
          - LINKED
          - PLAIN_TEXT
          type: string
          description: How a hyperlink should be displayed in a cell.
        text_rotation_vertical:
          type: boolean
          description: Make text read top to bottom.
      additionalProperties: false
  - id: get_conditional_format_rules
    slug: GOOGLESHEETS_GET_CONDITIONAL_FORMAT_RULES
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: List conditional formatting rules for each sheet (or a selected sheet) in a normalized, easy-to-edit
      form. Use when you need to view, audit, or prepare to modify conditional format rules.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      properties:
        sheet_id:
          type: integer
          description: 'Optional filter: return rules only for the sheet with this exact numeric sheetId. If not provided,
            returns rules for all sheets. If both sheet_title and sheet_id are provided, sheet_id takes precedence.'
        sheet_title:
          type: string
          description: 'Optional filter: return rules only for the sheet with this exact title. If not provided, returns
            rules for all sheets.'
        spreadsheet_id:
          type: string
          description: Unique identifier of the Google Spreadsheet, typically found in its URL.
        exclude_tables_in_banded_ranges:
          type: boolean
          description: True if tables should be excluded in the banded ranges. False if not set.
      additionalProperties: false
  - id: get_data_validation_rules
    slug: GOOGLESHEETS_GET_DATA_VALIDATION_RULES
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Tool to extract data validation rules from a Google Sheets spreadsheet. Use when you need to understand
      dropdown lists, allowed values, custom formulas, or other validation constraints for cells.
    input_schema:
      type: object
      required:
      - spreadsheetId
      properties:
        ranges:
          type: array
          items:
            type: string
          description: 'Optional list of A1 ranges to scan. If omitted, the entire sheet(s) will be scanned. WARNING:
            Scanning entire large sheets may be slow.'
        sheetId:
          type: integer
          description: Optional sheet ID to filter by. If omitted, all sheets will be scanned.
        sheetTitle:
          type: string
          description: Optional sheet title to filter by. If omitted, all sheets will be scanned.
        includeEmpty:
          type: boolean
          description: If true, include cells without validation rules in the output. Default is false.
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet to request.
      additionalProperties: false
  - id: get_sheet_names
    slug: GOOGLESHEETS_GET_SHEET_NAMES
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Lists all worksheet names from a specified Google Spreadsheet (which must exist), useful for discovering
      sheets before further operations.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      properties:
        exclude_hidden:
          type: boolean
          description: When True, hidden sheets will be excluded from the results. When False (default), all sheets
            including hidden ones are returned. Hidden sheets are sheets that have been hidden via the 'Hide sheet'
            option in Google Sheets UI.
        spreadsheet_id:
          type: string
          description: The unique identifier of the Google Spreadsheet (alphanumeric string, typically 44 characters).
            Extract only the ID portion from URLs - do not include leading/trailing slashes, '/edit' suffixes, query
            parameters, or URL fragments. From 'https://docs.google.com/spreadsheets/d/1qpyC0XzvTcKT6EISywY/edit#gid=0',
            use only '1qpyC0XzvTcKT6EISywY'.
      additionalProperties: false
  - id: get_spreadsheet_by_data_filter
    slug: GOOGLESHEETS_GET_SPREADSHEET_BY_DATA_FILTER
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Returns the spreadsheet at the given ID, filtered by the specified data filters. Use this tool when
      you need to retrieve specific subsets of data from a Google Sheet based on criteria like A1 notation, developer
      metadata, or grid ranges.
    input_schema:
      type: object
      required:
      - spreadsheetId
      properties:
        dataFilters:
          type: array
          items:
            type: object
            properties:
              a1Range:
                type: string
                description: Selects data that matches the specified A1 range. Exactly one of a1_range, developer_metadata_lookup,
                  or grid_range must be set.
              gridRange:
                type: object
                properties:
                  sheetId:
                    type: integer
                    description: The ID of the sheet this range is on.
                  endRowIndex:
                    type: integer
                    description: The end row (0-based, exclusive) of the range.
                    exclusiveMinimum: 0
                  startRowIndex:
                    type: integer
                    minimum: 0
                    description: The start row (0-based, inclusive) of the range.
                  endColumnIndex:
                    type: integer
                    description: The end column (0-based, exclusive) of the range.
                    exclusiveMinimum: 0
                  startColumnIndex:
                    type: integer
                    minimum: 0
                    description: The start column (0-based, inclusive) of the range.
                description: Selects data that matches the range described by the GridRange. Exactly one of a1_range,
                  developer_metadata_lookup, or grid_range must be set.
                additionalProperties: false
              developerMetadataLookup:
                type: object
                properties:
                  metadataId:
                    type: integer
                    description: Filter by metadata ID.
                  visibility:
                    enum:
                    - DOCUMENT
                    - PROJECT
                    type: string
                    description: Metadata visibility.
                  metadataKey:
                    type: string
                    description: Filter by metadata key.
                  locationType:
                    enum:
                    - ROW
                    - COLUMN
                    - SHEET
                    - SPREADSHEET
                    - OBJECT
                    type: string
                    description: Location type of metadata.
                  metadataValue:
                    type: string
                    description: Filter by metadata value.
                description: Selects data associated with developer metadata. Exactly one of a1_range, developer_metadata_lookup,
                  or grid_range must be set.
                additionalProperties: false
            additionalProperties: false
          description: 'The DataFilters used to select which ranges to retrieve. Supports A1 notation (e.g., ''Sheet1!A1:B2''),
            developer metadata lookup, or grid range filters. If empty or omitted, returns full spreadsheet metadata.
            Recommended: Use GOOGLESHEETS_GET_SPREADSHEET_INFO for unfiltered retrieval as it is the dedicated action
            for that purpose.'
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet to request.
        includeGridData:
          type: boolean
          description: True if grid data should be returned. Ignored if a field mask is set.
        excludeTablesInBandedRanges:
          type: boolean
          description: True if tables should be excluded in the banded ranges. False if not set.
      additionalProperties: false
  - id: get_spreadsheet_info
    slug: GOOGLESHEETS_GET_SPREADSHEET_INFO
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Retrieves metadata for a Google Spreadsheet using its ID. By default, returns essential information
      (ID, title, sheet properties) to avoid payload size issues. Use the fields parameter for comprehensive metadata
      or specific fields.
    input_schema:
      type: object
      properties:
        fields:
          type: string
          description: 'Optional. Field mask specifying which fields to return. Uses Google''s field mask syntax (comma-separated,
            dot-notation for nested fields). If not specified, a default mask returning common fields (spreadsheet
            ID, title, sheet properties) is applied to avoid payload size issues. For full metadata, use ''*'' (not
            recommended for large spreadsheets). When set, includeGridData is ignored. Examples: ''sheets.properties(sheetId,title)'',
            ''properties.title,sheets.properties.sheetId''.'
        ranges:
          type: array
          items:
            type: string
          description: Optional. The ranges to retrieve from the spreadsheet, specified using A1 notation (e.g., 'Sheet1!A1:D5',
            'Sheet2!A1:C4'). Multiple ranges can be requested simultaneously. If not specified, metadata for the entire
            spreadsheet is returned without grid data.
        spreadsheet_id:
          type: string
          minLength: 1
          description: 'Required. The Google Sheets spreadsheet ID or full URL. Accepts either the ID alone (e.g.,
            ''1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms'') or a full Google Sheets URL (e.g., ''https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/edit'').
            The ID will be automatically extracted from URLs. Note: Published/embedded URLs (containing ''/d/e/2PACX-...'')
            are not supported.'
        include_grid_data:
          type: boolean
          description: Optional. If true, grid data will be returned. This parameter is ignored if a field mask was
            set in the request. When false or not specified, only metadata is returned without cell values.
        exclude_tables_in_banded_ranges:
          type: boolean
          description: Optional. If true, tables within banded ranges will be omitted from the response. Default is
            false when not specified.
      additionalProperties: false
  - id: insert_dimension
    slug: GOOGLESHEETS_INSERT_DIMENSION
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to insert new rows or columns into a sheet at a specified location. Use when you need to add
      empty rows or columns within an existing Google Sheet.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - insert_dimension
      properties:
        spreadsheet_id:
          type: string
          description: The ID of the spreadsheet to update.
        response_ranges:
          type: array
          items:
            type: string
          description: Limits the ranges of the spreadsheet to include in the response.
        insert_dimension:
          type: object
          required:
          - range
          properties:
            range:
              type: object
              required:
              - sheet_id
              - dimension
              - start_index
              - end_index
              properties:
                sheet_id:
                  type: integer
                  description: The numeric ID of the sheet (tab) where dimensions will be inserted. For newly created
                    spreadsheets, the first sheet typically has sheet_id=0. However, sheet IDs are not guaranteed
                    to be 0 or sequential for all spreadsheets. If you encounter a 'No grid with id' error, retrieve
                    the actual sheet ID from spreadsheet metadata using GOOGLESHEETS_GET_SPREADSHEET_INFO or GOOGLESHEETS_GET_SHEET_NAMES
                    (found in 'sheets[].properties.sheetId').
                dimension:
                  enum:
                  - ROWS
                  - COLUMNS
                  type: string
                  description: The dimension to insert. Valid values are "ROWS" or "COLUMNS".
                end_index:
                  type: integer
                  description: The 0-based exclusive end index. Must be greater than start_index. The number of rows/columns
                    inserted equals (end_index - start_index). For example, to insert 3 rows starting at row 1, use
                    start_index=1 and end_index=4.
                start_index:
                  type: integer
                  description: The 0-based index where the new rows/columns will be inserted. For example, to insert
                    at row 1 (the second row), use start_index=1. Must be less than end_index.
              description: Specifies the dimensions to insert. Can be provided as a nested object with sheet_id, dimension,
                start_index, and end_index, or these fields can be provided directly in insert_dimension (will be
                auto-wrapped).
              additionalProperties: false
            inherit_from_before:
              type: boolean
              description: If true, the new dimensions will inherit properties from the dimension before the startIndex.
                If false (default), they will inherit from the dimension at the startIndex. startIndex must be greater
                than 0 if inheritFromBefore is true.
          description: The details for the insert dimension request.
          additionalProperties: false
        response_include_grid_data:
          type: boolean
          description: True if grid data should be included in the response (if includeSpreadsheetInResponse is true).
        include_spreadsheet_in_response:
          type: boolean
          description: True if the updated spreadsheet should be included in the response.
      additionalProperties: false
  - id: list_charts
    slug: GOOGLESHEETS_LIST_CHARTS
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Lists all charts in a Google Sheets spreadsheet across all sheets, returning chart_id, sheet metadata,
      chart type, title, and position.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      properties:
        chart_id:
          type: integer
          description: Optional. Filter to a specific chart by its numeric chart ID. When provided, returns only the
            matching chart if it exists in the spreadsheet.
        sheet_id:
          type: integer
          description: Optional. Filter results to a single sheet's charts by providing the numeric sheet ID (not
            the sheet name). When omitted, returns charts from all sheets in the spreadsheet.
        include_spec:
          type: boolean
          description: When true, include the full ChartSpec dictionary for each chart (contains all chart configuration
            details including series, axes, colors, etc.). When false (default), return only a compact summary with
            chart_id, type, title, and position. Set to false to keep responses small.
        spreadsheet_id:
          type: string
          minLength: 1
          description: 'Required. The Google Sheets spreadsheet ID or full URL. Accepts either the ID alone (e.g.,
            ''1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms'') or a full Google Sheets URL (e.g., ''https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/edit'').
            The ID will be automatically extracted from URLs. Note: Published/embedded URLs (containing ''/d/e/2PACX-...'')
            are not supported.'
      additionalProperties: false
  - id: look_up_spreadsheet_row
    slug: GOOGLESHEETS_LOOKUP_SPREADSHEET_ROW
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Finds the first row in a Google Spreadsheet where a cell's entire content exactly matches the query
      string, searching within a specified A1 notation range or the first sheet by default.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - query
      properties:
        query:
          type: string
          description: Exact text value to find; matches the entire content of a cell in a row.
        range:
          type: string
          description: 'A1 notation range to search within. Supports cell ranges (e.g., ''Sheet1!A1:D5''), column-only
            ranges (e.g., ''Sheet1!A:Z''), and row-only ranges (e.g., ''Sheet1!1:1''). Defaults to the first sheet
            if omitted. IMPORTANT: Sheet names with spaces must be single-quoted (e.g., "''My Sheet''!A1:Z"). Bare
            sheet names without ranges (e.g., ''Sheet1'') are not supported - always specify a range.'
        case_sensitive:
          type: boolean
          description: If `True`, the query string search is case-sensitive.
        spreadsheet_id:
          type: string
          description: Identifier of the Google Spreadsheet to search.
        value_render_option:
          enum:
          - FORMATTED_VALUE
          - UNFORMATTED_VALUE
          - FORMULA
          type: string
          description: 'How cell values are rendered in the returned row data. unformatted: raw values without display
            formatting — dates appear as serial numbers, e.g. 46009.47 (default, keeps consistency with UPSERT). formatted:
            display-formatted values — dates appear as strings, e.g. ''2025-12-18''. formula: raw formulas instead
            of computed values.'
        normalize_whitespace:
          type: boolean
          description: If `True`, strips leading and trailing whitespace from cell values before matching. This helps
            match cells like ' TOTAL ' or 'TOTAL ' when searching for 'TOTAL'.
        date_time_render_option:
          type: string
          description: 'How dates and times are represented. FORMATTED_STRING: human-readable strings (e.g. ''2025-12-18
            11:17''). SERIAL_NUMBER: Excel-style serial numbers. Works with all value_render_option settings.'
      additionalProperties: false
  - id: move_or_resize_chart
    slug: GOOGLESHEETS_MOVE_CHART
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Move or resize an existing chart on a Google Sheets spreadsheet. Use this action when you need to
      reposition a chart to a different location on the same or different sheet, move it to a brand-new sheet, or
      change its size.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - chart_id
      properties:
        chart_id:
          type: integer
          description: The unique numeric identifier of the chart to move within the spreadsheet. This is the chartId
            value (also known as objectId) returned when the chart was created or can be retrieved using GOOGLESHEETS_LIST_CHARTS
            or 'Get Spreadsheet Info' action (look for sheets[].charts[].chartId in the response). The chart must
            already exist in the specified spreadsheet.
          exclusiveMinimum: 0
        new_sheet:
          type: boolean
          description: Set to true to move the chart to a brand-new sheet. Google Sheets will automatically create
            and name the new sheet. This is mutually exclusive with target_sheet_id and anchor_sheet_id.
        width_pixels:
          type: integer
          description: Width of the chart in pixels. Only valid when anchor_sheet_id is provided. If omitted, Google
            Sheets preserves the existing width.
          exclusiveMinimum: 0
        height_pixels:
          type: integer
          description: Height of the chart in pixels. Only valid when anchor_sheet_id is provided. If omitted, Google
            Sheets preserves the existing height.
          exclusiveMinimum: 0
        spreadsheet_id:
          type: string
          description: 'The unique identifier of the Google Sheets spreadsheet containing the chart to move. Must
            be the actual spreadsheet ID from the URL (e.g., ''1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms''), NOT
            the spreadsheet name or title. Find it in the URL: https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit'
        anchor_sheet_id:
          type: integer
          description: The numeric sheetId of the sheet to anchor the chart onto when repositioning via overlay coordinates.
            Required if any of anchor_row_index, anchor_column_index, offset_x_pixels, offset_y_pixels, width_pixels,
            or height_pixels is provided. This is mutually exclusive with new_sheet and target_sheet_id.
        offset_x_pixels:
          type: integer
          description: Horizontal pixel offset from the anchor cell. Only valid when anchor_sheet_id is provided.
            If omitted, Google Sheets preserves the existing horizontal offset.
        offset_y_pixels:
          type: integer
          description: Vertical pixel offset from the anchor cell. Only valid when anchor_sheet_id is provided. If
            omitted, Google Sheets preserves the existing vertical offset.
        target_sheet_id:
          type: integer
          description: The numeric sheetId of an existing sheet to move the chart to. The chart's anchor position
            on that sheet will remain unchanged. This is mutually exclusive with new_sheet and anchor_sheet_id. Use
            'Get Spreadsheet Info' to retrieve valid sheetIds.
        anchor_row_index:
          type: integer
          minimum: 0
          description: The 0-based row index of the anchor cell for overlay positioning. Required if anchor_sheet_id
            is set. Must be used together with anchor_column_index.
        anchor_column_index:
          type: integer
          minimum: 0
          description: The 0-based column index of the anchor cell for overlay positioning. Required if anchor_sheet_id
            is set. Must be used together with anchor_row_index.
      additionalProperties: false
  - id: search_developer_metadata
    slug: GOOGLESHEETS_SEARCH_DEVELOPER_METADATA
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Tool to search for developer metadata in a spreadsheet. Use when you need to find specific metadata
      entries based on filters.
    input_schema:
      type: object
      required:
      - spreadsheetId
      - dataFilters
      properties:
        dataFilters:
          type: array
          items:
            type: object
            properties:
              a1Range:
                type: string
                description: 'Selects DeveloperMetadata associated with the given A1 range. Must represent a single
                  row or single column only. Valid examples: ''A:A'' (entire column A), ''Sheet1!B:B'' (column B in
                  Sheet1), ''1:1'' (entire row 1), ''Sheet1!5:5'' (row 5 in Sheet1). Invalid examples: ''A1:D7'' (multi-row/multi-column
                  range), ''A1'' (single cell).'
              gridRange:
                type: object
                description: Selects DeveloperMetadata associated with the given grid range. The developer metadata
                  must be associated with a location that overlaps the range.
                additionalProperties: true
              developerMetadataLookup:
                type: object
                properties:
                  metadataId:
                    type: integer
                    description: Filters by the specific metadata ID.
                  visibility:
                    type: string
                    description: 'Restricts to metadata with the specified visibility. Valid values: DEVELOPER_METADATA_VISIBILITY_UNSPECIFIED,
                      DOCUMENT, PROJECT'
                  metadataKey:
                    type: string
                    description: Filters by the metadata key.
                  locationType:
                    type: string
                    description: 'Restricts the search to developer metadata of the specified location type. Valid
                      values: DEVELOPER_METADATA_LOCATION_TYPE_UNSPECIFIED, ROW, COLUMN, SHEET, SPREADSHEET'
                  metadataValue:
                    type: string
                    description: Filters by the metadata value.
                  metadataLocation:
                    type: object
                    properties:
                      sheetId:
                        type: integer
                        description: The ID of the sheet the metadata is associated with (sheet-wide association).
                      spreadsheet:
                        type: boolean
                        description: True if the metadata is associated with the entire spreadsheet.
                      locationType:
                        type: string
                        description: The type of location the metadata is associated with.
                      dimensionRange:
                        type: object
                        properties:
                          sheetId:
                            type: integer
                            description: The ID of the sheet this dimension range is on.
                          endIndex:
                            type: integer
                            description: The exclusive end index of the dimension range.
                          dimension:
                            type: string
                            description: The dimension this range spans.
                          startIndex:
                            type: integer
                            description: The inclusive start index of the dimension range.
                        description: A range of a single dimension (either rows or columns) on a sheet. Indexes are
                          zero-based; endIndex is exclusive.
                        additionalProperties: false
                    description: Describes the location where developer metadata is attached. Exactly one of spreadsheet,
                      sheetId, or dimensionRange is set, and locationType reflects that location.
                    additionalProperties: false
                  locationMatchingStrategy:
                    type: string
                    description: 'Determines how the metadata location is matched. Valid values: DEVELOPER_METADATA_LOCATION_MATCHING_STRATEGY_UNSPECIFIED,
                      EXACT_LOCATION, INTERSECTING_LOCATION'
                description: Selects DeveloperMetadata that matches all of the specified fields. Enables filtering
                  by various criteria like ID, key, value, location, and visibility.
                additionalProperties: false
            additionalProperties: false
          description: The data filters describing the criteria used to determine which DeveloperMetadata entries
            to return.
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet to retrieve metadata from.
      additionalProperties: false
  - id: search_spreadsheets
    slug: GOOGLESHEETS_SEARCH_SPREADSHEETS
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Search for Google Spreadsheets using various filters including name, content, date ranges, and more.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query to filter spreadsheets. Behavior depends on the 'search_type' parameter. For advanced
            searches, use Google Drive query syntax with fields like 'name contains', 'fullText contains', or boolean
            filters like 'sharedWithMe = true'. DO NOT use spreadsheet IDs as search terms. Leave empty to get all
            spreadsheets.
        order_by:
          type: string
          description: 'Sort order (comma-separated list for multi-field sorting). Valid fields: createdTime, folder,
            modifiedByMeTime, modifiedTime, name, name_natural, quotaBytesUsed, recency, sharedWithMeTime, starred,
            viewedByMeTime. Append '' desc'' for descending order (default is ascending). Examples: ''modifiedTime
            desc'', ''folder,name'', ''starred,modifiedTime desc''.'
        page_token:
          type: string
          description: Token for retrieving the next page of results. Use the 'next_page_token' value from a previous
            response to get subsequent pages. Leave empty to get the first page.
        max_results:
          type: integer
          maximum: 1000
          minimum: 1
          description: Maximum number of spreadsheets to return (1-1000). Defaults to 10.
        search_type:
          enum:
          - name
          - content
          - both
          type: string
          description: 'How to search: ''name'' searches filenames only (prefix matching from the START of filenames),
            ''content'' uses fullText search which searches file content, name, description, and metadata (Google
            Drive API limitation: cannot search content exclusively without also matching filenames), ''both'' explicitly
            searches both name OR content with an OR condition. Note: ''name'' search only matches from the START
            of filenames (e.g., ''Budget'' finds ''Budget 2024'' but NOT ''Q1 Budget'').'
        starred_only:
          type: boolean
          description: Whether to return only starred spreadsheets. Defaults to False.
        created_after:
          type: string
          description: Return spreadsheets created after this date. Use RFC 3339 format like '2024-01-01T00:00:00Z'.
        modified_after:
          type: string
          description: Return spreadsheets modified after this date. Use RFC 3339 format like '2024-01-01T00:00:00Z'.
        shared_with_me:
          type: boolean
          description: Whether to return only spreadsheets shared with the current user. Defaults to False.
        include_trashed:
          type: boolean
          description: Whether to include spreadsheets in trash. Defaults to False.
        include_shared_drives:
          type: boolean
          description: Whether to include spreadsheets from shared drives you have access to. Defaults to True.
      additionalProperties: false
  - id: set_basic_filter
    slug: GOOGLESHEETS_SET_BASIC_FILTER
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to set a basic filter on a sheet in a Google Spreadsheet. Use when you need to filter or sort
      data within a specific range on a sheet.
    input_schema:
      type: object
      required:
      - spreadsheetId
      - filter
      properties:
        filter:
          type: object
          properties:
            range:
              type: object
              required:
              - sheet_id
              properties:
                sheet_id:
                  type: integer
                  description: The sheet this range is on.
                end_row_index:
                  type: integer
                  description: The end row (exclusive) of the range, or not set if unbounded.
                start_row_index:
                  type: integer
                  description: The start row (inclusive) of the range, or not set if unbounded.
                end_column_index:
                  type: integer
                  description: The end column (exclusive) of the range, or not set if unbounded.
                start_column_index:
                  type: integer
                  description: The start column (inclusive) of the range, or not set if unbounded.
              description: The range the filter covers. When writing, only one of range or tableId may be set.
              additionalProperties: false
            tableId:
              type: string
              description: The table this filter is backed by, if any. When writing, only one of range or tableId
                may be set.
            criteria:
              type: object
              description: (Deprecated) The criteria for showing/hiding values per column. The key is the column index.
                Use filterSpecs instead.
              additionalProperties:
                type: object
                properties:
                  condition:
                    anyOf:
                    - type: object
                      required:
                      - type
                      properties:
                        type:
                          type: string
                          description: The type of condition.
                        values:
                          anyOf:
                          - type: array
                            items:
                              type: object
                              properties:
                                relative_date:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                  description: A relative date.
                                user_entered_value:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                  description: A value the condition is based on.
                              additionalProperties: false
                          - type: 'null'
                          description: The values of the condition.
                      additionalProperties: false
                    - type: 'null'
                    description: A condition that must be true for values to be shown.
                  hiddenValues:
                    anyOf:
                    - type: array
                      items:
                        type: string
                    - type: 'null'
                    description: Values that should be hidden.
                  visibleBackgroundColorStyle:
                    anyOf:
                    - type: object
                      properties:
                        rgbColor:
                          anyOf:
                          - type: object
                            properties:
                              red:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The amount of red in the color as a value in the interval [0, 1].
                              blue:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The amount of blue in the color as a value in the interval [0, 1].
                              alpha:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The fraction of this color that should be applied to the pixel.
                              green:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The amount of green in the color as a value in the interval [0, 1].
                            additionalProperties: false
                          - type: 'null'
                          description: The RGB color value for the color style.
                        themeColor:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: The theme color type for the color style.
                      additionalProperties: false
                    - type: 'null'
                    description: The background fill color to filter by.
                  visibleForegroundColorStyle:
                    anyOf:
                    - type: object
                      properties:
                        rgbColor:
                          anyOf:
                          - type: object
                            properties:
                              red:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The amount of red in the color as a value in the interval [0, 1].
                              blue:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The amount of blue in the color as a value in the interval [0, 1].
                              alpha:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The fraction of this color that should be applied to the pixel.
                              green:
                                anyOf:
                                - type: number
                                - type: 'null'
                                description: The amount of green in the color as a value in the interval [0, 1].
                            additionalProperties: false
                          - type: 'null'
                          description: The RGB color value for the color style.
                        themeColor:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: The theme color type for the color style.
                      additionalProperties: false
                    - type: 'null'
                    description: The foreground color to filter by.
                additionalProperties: false
            sortSpecs:
              type: array
              items:
                type: object
                properties:
                  sortOrder:
                    enum:
                    - ASCENDING
                    - DESCENDING
                    - SORT_ORDER_UNSPECIFIED
                    type: string
                    description: The order data should be sorted.
                  dimensionIndex:
                    type: integer
                    description: The dimension the sort should be applied to.
                  backgroundColorStyle:
                    type: object
                    properties:
                      rgbColor:
                        type: object
                        properties:
                          red:
                            type: number
                            description: The amount of red in the color as a value in the interval [0, 1].
                          blue:
                            type: number
                            description: The amount of blue in the color as a value in the interval [0, 1].
                          alpha:
                            type: number
                            description: The fraction of this color that should be applied to the pixel.
                          green:
                            type: number
                            description: The amount of green in the color as a value in the interval [0, 1].
                        description: The RGB color value for the color style.
                        additionalProperties: false
                      themeColor:
                        type: string
                        description: The theme color type for the color style.
                    description: The background fill color to sort by.
                    additionalProperties: false
                  foregroundColorStyle:
                    type: object
                    properties:
                      rgbColor:
                        type: object
                        properties:
                          red:
                            type: number
                            description: The amount of red in the color as a value in the interval [0, 1].
                          blue:
                            type: number
                            description: The amount of blue in the color as a value in the interval [0, 1].
                          alpha:
                            type: number
                            description: The fraction of this color that should be applied to the pixel.
                          green:
                            type: number
                            description: The amount of green in the color as a value in the interval [0, 1].
                        description: The RGB color value for the color style.
                        additionalProperties: false
                      themeColor:
                        type: string
                        description: The theme color type for the color style.
                    description: The foreground color to sort by.
                    additionalProperties: false
                  dataSourceColumnReference:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The display name of the column.
                    description: Reference to a data source column.
                    additionalProperties: false
                additionalProperties: false
              description: The sort specifications for the filter.
            filterSpecs:
              type: array
              items:
                type: object
                properties:
                  columnIndex:
                    type: integer
                    description: The zero-based column index.
                  filterCriteria:
                    type: object
                    properties:
                      condition:
                        type: object
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: The type of condition.
                          values:
                            type: array
                            items:
                              type: object
                              properties:
                                relative_date:
                                  type: string
                                  description: A relative date.
                                user_entered_value:
                                  type: string
                                  description: A value the condition is based on.
                              additionalProperties: false
                            description: The values of the condition.
                        description: A condition that must be true for values to be shown.
                        additionalProperties: false
                      hiddenValues:
                        type: array
                        items:
                          type: string
                        description: Values that should be hidden.
                      visibleBackgroundColorStyle:
                        type: object
                        properties:
                          rgbColor:
                            type: object
                            properties:
                              red:
                                type: number
                                description: The amount of red in the color as a value in the interval [0, 1].
                              blue:
                                type: number
                                description: The amount of blue in the color as a value in the interval [0, 1].
                              alpha:
                                type: number
                                description: The fraction of this color that should be applied to the pixel.
                              green:
                                type: number
                                description: The amount of green in the color as a value in the interval [0, 1].
                            description: The RGB color value for the color style.
                            additionalProperties: false
                          themeColor:
                            type: string
                            description: The theme color type for the color style.
                        description: The background fill color to filter by.
                        additionalProperties: false
                      visibleForegroundColorStyle:
                        type: object
                        properties:
                          rgbColor:
                            type: object
                            properties:
                              red:
                                type: number
                                description: The amount of red in the color as a value in the interval [0, 1].
                              blue:
                                type: number
                                description: The amount of blue in the color as a value in the interval [0, 1].
                              alpha:
                                type: number
                                description: The fraction of this color that should be applied to the pixel.
                              green:
                                type: number
                                description: The amount of green in the color as a value in the interval [0, 1].
                            description: The RGB color value for the color style.
                            additionalProperties: false
                          themeColor:
                            type: string
                            description: The theme color type for the color style.
                        description: The foreground color to filter by.
                        additionalProperties: false
                    description: The criteria for the column.
                    additionalProperties: false
                  dataSourceColumnReference:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The display name of the column.
                    description: Reference to a data source column.
                    additionalProperties: false
                additionalProperties: false
              description: The filter criteria per column. Both criteria and filterSpecs are populated in responses.
                If both fields are specified in an update request, this field takes precedence.
          description: The filter to set.
          additionalProperties: false
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet.
        responseRanges:
          type: array
          items:
            type: string
          description: Limits the ranges included in the response spreadsheet. Meaningful only if includeSpreadsheetInResponse
            is true.
        responseIncludeGridData:
          type: boolean
          description: True if grid data should be returned. Meaningful only if includeSpreadsheetInResponse is true.
            Ignored if a field mask was set in the request.
        includeSpreadsheetInResponse:
          type: boolean
          description: Determines if the updated spreadsheet resource appears in the response. Default is false.
      additionalProperties: false
  - id: set_data_validation_rule
    slug: GOOGLESHEETS_SET_DATA_VALIDATION_RULE
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to set or clear data validation rules (including dropdowns) on a range in Google Sheets. Use
      when you need to apply dropdown lists, range-based dropdowns, or custom formula validation to cells.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - sheet_id
      - mode
      - start_row_index
      - end_row_index
      - start_column_index
      - end_column_index
      properties:
        mode:
          enum:
          - SET
          - CLEAR
          type: string
          description: 'Operation mode: ''SET'' applies a validation rule to the range, ''CLEAR'' removes any existing
            validation from the range.'
        strict:
          type: boolean
          description: Whether to reject invalid data (true) or show a warning (false). Default is true.
        values:
          type: array
          items:
            type: string
          description: List of allowed values for dropdown. Required when validation_type='ONE_OF_LIST'. Each item
            becomes a dropdown option.
        formula:
          type: string
          description: 'Custom formula for validation. Required when validation_type=''CUSTOM_FORMULA''. Formula should
            evaluate to TRUE/FALSE. Example: ''=A1>10''.'
        sheet_id:
          type: integer
          description: The unique sheet ID (numeric identifier) where the validation rule will be applied. The first
            sheet created in a spreadsheet typically has ID 0, while additional sheets get unique IDs (e.g., 1534097477).
            If a sheet is deleted, its ID is never reused - so if the original first sheet (ID 0) was deleted, attempting
            to use 0 will fail. Always verify the actual sheet ID exists using GOOGLESHEETS_GET_SPREADSHEET_INFO action
            (check 'sheets[].properties.sheetId' field).
        end_row_index:
          type: integer
          description: Ending row index (0-based, exclusive) for the validation range. To apply to row 1 only, use
            start_row_index=0 and end_row_index=1.
        input_message:
          type: string
          description: Optional message shown to the user when they select the cell. Helpful hint about what values
            are expected.
        show_custom_ui:
          type: boolean
          description: Whether to show a dropdown UI for list-based validation. Default is true. Set to true for dropdown
            lists.
        spreadsheet_id:
          type: string
          description: The unique identifier of the Google Sheets spreadsheet. Can be found in the spreadsheet URL
            between '/d/' and '/edit'.
        source_range_a1:
          type: string
          description: 'Source range in A1 notation for dropdown values. Required when validation_type=''ONE_OF_RANGE''.
            Example: ''Sheet1!A1:A10'' or ''A1:A10''.'
        start_row_index:
          type: integer
          description: Starting row index (0-based, inclusive) for the validation range. Row 1 is index 0.
        validation_type:
          enum:
          - ONE_OF_LIST
          - ONE_OF_RANGE
          - CUSTOM_FORMULA
          - NUMBER_GREATER
          - NUMBER_GREATER_THAN_EQ
          - NUMBER_LESS
          - NUMBER_LESS_THAN_EQ
          - NUMBER_EQ
          - NUMBER_NOT_EQ
          - NUMBER_BETWEEN
          - NUMBER_NOT_BETWEEN
          - TEXT_CONTAINS
          - TEXT_NOT_CONTAINS
          - TEXT_EQ
          - TEXT_NOT_EQ
          - TEXT_IS_EMAIL
          - TEXT_IS_URL
          - DATE_EQ
          - DATE_BEFORE
          - DATE_AFTER
          - DATE_ON_OR_BEFORE
          - DATE_ON_OR_AFTER
          - DATE_BETWEEN
          - DATE_NOT_BETWEEN
          - DATE_NOT_EQ
          - DATE_IS_VALID
          - BLANK
          - NOT_BLANK
          - BOOLEAN
          type: string
          description: 'Type of validation rule to apply. Required when mode=''SET''. Dropdown types: ''ONE_OF_LIST''
            (dropdown from list), ''ONE_OF_RANGE'' (dropdown from range). Number validations: ''NUMBER_GREATER'',
            ''NUMBER_GREATER_THAN_EQ'', ''NUMBER_LESS'', ''NUMBER_LESS_THAN_EQ'', ''NUMBER_EQ'', ''NUMBER_NOT_EQ'',
            ''NUMBER_BETWEEN'', ''NUMBER_NOT_BETWEEN''. Text validations: ''TEXT_CONTAINS'', ''TEXT_NOT_CONTAINS'',
            ''TEXT_EQ'', ''TEXT_NOT_EQ'', ''TEXT_IS_EMAIL'', ''TEXT_IS_URL'' (Note: TEXT_STARTS_WITH and TEXT_ENDS_WITH
            are only for conditional formatting, not data validation). Date validations: ''DATE_EQ'', ''DATE_BEFORE'',
            ''DATE_AFTER'', ''DATE_ON_OR_BEFORE'', ''DATE_ON_OR_AFTER'', ''DATE_BETWEEN'', ''DATE_NOT_BETWEEN'', ''DATE_NOT_EQ'',
            ''DATE_IS_VALID''. Other: ''BLANK'', ''NOT_BLANK'', ''BOOLEAN'', ''CUSTOM_FORMULA''.'
        condition_values:
          type: array
          items:
            type: string
          description: Generic list of condition values for validation types that require specific values (e.g., NUMBER_GREATER
            requires one value, NUMBER_BETWEEN requires two values, TEXT_CONTAINS requires one value). For simple
            validations like TEXT_IS_EMAIL, BLANK, NOT_BLANK, BOOLEAN, DATE_IS_VALID, this can be omitted. Each value
            should be a string that will be parsed by Google Sheets.
        end_column_index:
          type: integer
          description: Ending column index (0-based, exclusive) for the validation range. To apply to column A only,
            use start_column_index=0 and end_column_index=1.
        start_column_index:
          type: integer
          description: Starting column index (0-based, inclusive) for the validation range. Column A is index 0.
        filtered_rows_included:
          type: boolean
          description: Whether to apply validation to rows hidden by filters. Default is false. Set to true to ensure
            validation applies to both visible and filtered rows.
      additionalProperties: false
  - id: sort_range
    slug: GOOGLESHEETS_SORT_RANGE
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Sorts data within a specified range in a Google Sheet based on one or more sort criteria. Use this
      action when you need to reorder rows in a range by column values, with support for multi-level (cascading) sorts.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - range
      - sortSpecs
      properties:
        range:
          type: object
          required:
          - sheet_id
          properties:
            sheet_id:
              type: integer
              description: The sheet this range is on.
            end_row_index:
              type: integer
              minimum: 0
              description: The end row (exclusive) of the range, or not set if unbounded.
            start_row_index:
              type: integer
              minimum: 0
              description: The start row (inclusive) of the range, or not set if unbounded.
            end_column_index:
              type: integer
              minimum: 0
              description: The end column (exclusive) of the range, or not set if unbounded. For columns, 3 = column
                C (exclusive).
            start_column_index:
              type: integer
              minimum: 0
              description: The start column (inclusive) of the range, or not set if unbounded. For columns, 0 = column
                A, 1 = column B, etc.
          description: The range to sort. All cells in this range will be reordered based on the sort specifications.
          additionalProperties: false
        sortSpecs:
          type: array
          items:
            type: object
            properties:
              sortOrder:
                type: string
                description: The order data should be sorted. Use 'ASCENDING' or 'DESCENDING'.
              dimensionIndex:
                type: integer
                minimum: 0
                description: The dimension (column or row index) the sort should be applied to. Zero-based index.
              backgroundColorStyle:
                type: object
                properties:
                  rgbColor:
                    type: object
                    properties:
                      red:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The amount of red in the color as a value in the interval [0, 1].
                      blue:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The amount of blue in the color as a value in the interval [0, 1].
                      alpha:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The fraction of this color that should be applied to the pixel.
                      green:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The amount of green in the color as a value in the interval [0, 1].
                    description: RGB color representation.
                    additionalProperties: false
                  themeColor:
                    type: string
                    description: Theme color type (e.g., TEXT, BACKGROUND, ACCENT1). Specify either rgbColor or themeColor,
                      not both.
                description: Color specification using RGB or theme color.
                additionalProperties: false
              foregroundColorStyle:
                type: object
                properties:
                  rgbColor:
                    type: object
                    properties:
                      red:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The amount of red in the color as a value in the interval [0, 1].
                      blue:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The amount of blue in the color as a value in the interval [0, 1].
                      alpha:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The fraction of this color that should be applied to the pixel.
                      green:
                        type: number
                        maximum: 1
                        minimum: 0
                        description: The amount of green in the color as a value in the interval [0, 1].
                    description: RGB color representation.
                    additionalProperties: false
                  themeColor:
                    type: string
                    description: Theme color type (e.g., TEXT, BACKGROUND, ACCENT1). Specify either rgbColor or themeColor,
                      not both.
                description: Color specification using RGB or theme color.
                additionalProperties: false
              dataSourceColumnReference:
                type: object
                properties:
                  name:
                    type: string
                    description: The display name of the column.
                description: Reference to a data source column.
                additionalProperties: false
            description: Defines a sort order for a column or row.
            additionalProperties: false
          minItems: 1
          description: The sort order per column. Later specifications are used when values are equal in the earlier
            specifications (cascading sort). At least one sort specification is required.
        responseRanges:
          type: array
          items:
            type: string
          description: Limits the ranges included in the response spreadsheet. Meaningful only if includeSpreadsheetInResponse
            is true.
        spreadsheet_id:
          type: string
          description: The ID of the spreadsheet.
        responseIncludeGridData:
          type: boolean
          description: True if grid data should be returned. Meaningful only if includeSpreadsheetInResponse is true.
        includeSpreadsheetInResponse:
          type: boolean
          description: Determines if the updated spreadsheet resource appears in the response. Default is false.
      additionalProperties: false
  - id: batch_get_spreadsheet_values_by_data_filter
    slug: GOOGLESHEETS_SPREADSHEETS_VALUES_BATCH_GET_BY_DATA_FILTER
    version: '20261001_00'
    action_class: read
    capability: sheets.read
    description: Tool to return one or more ranges of values from a spreadsheet that match the specified data filters.
      Use when you need to retrieve specific data sets based on filtering criteria rather than entire sheets or fixed
      ranges.
    input_schema:
      type: object
      required:
      - spreadsheetId
      - dataFilters
      properties:
        dataFilters:
          type: array
          items:
            type: object
            properties:
              a1Range:
                type: string
                description: Selects data that matches the specified A1 range notation (e.g., 'Sheet1!A1:B10'). This
                  is the recommended way to specify ranges as it uses the sheet name directly. Either a1Range or gridRange
                  must be provided, but not both.
              gridRange:
                type: object
                properties:
                  sheetId:
                    type: integer
                    description: 'The unique numeric identifier of the sheet (NOT the sheet index or name). This is
                      a stable ID assigned when a sheet is created. To find valid sheet IDs, use the ''Get Spreadsheet
                      Info'' or ''Get Sheet Names'' action to retrieve sheet metadata. IMPORTANT: sheetId=0 is NOT
                      a default or ''first sheet'' indicator - it only works if a sheet with ID 0 actually exists
                      in the spreadsheet. Many spreadsheets do not have a sheet with ID 0. Always verify the sheet
                      ID from spreadsheet metadata before using gridRange. For most use cases, prefer using a1Range
                      (e.g., ''Sheet1!A1:B10'') instead, which uses the sheet name.'
                  endRowIndex:
                    type: integer
                    description: The end row (0-indexed) of the range, exclusive.
                  startRowIndex:
                    type: integer
                    description: The start row (0-indexed) of the range, inclusive.
                  endColumnIndex:
                    type: integer
                    description: The end column (0-indexed) of the range, exclusive.
                  startColumnIndex:
                    type: integer
                    description: The start column (0-indexed) of the range, inclusive.
                description: Selects data that matches the specified grid range using numeric indices. Requires knowing
                  the sheet's numeric ID. Either a1Range or gridRange must be provided, but not both.
                additionalProperties: false
            additionalProperties: false
          description: 'Required. An array of data filter objects used to match ranges of values to retrieve. Each
            filter can specify either ''a1Range'' (e.g., ''Sheet1!A1:B5'') or ''gridRange''. Must be provided as a
            list, e.g., [{''a1Range'': ''Sheet1!A1:B5''}]. A single filter object will be automatically wrapped in
            a list.'
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet to retrieve data from. This is the unique identifier found in the
            spreadsheet URL (e.g., in 'https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit', the ID is the
            SPREADSHEET_ID part). Typical Google Sheets IDs are approximately 44 characters long and contain alphanumeric
            characters, hyphens, and underscores.
        majorDimension:
          enum:
          - ROWS
          - COLUMNS
          type: string
          description: 'The major dimension that results should use. For example, if the spreadsheet data is: A1=1,B1=2,A2=3,B2=4,
            then a request that selects that range and sets majorDimension=ROWS returns [[1,2],[3,4]], whereas a request
            that sets majorDimension=COLUMNS returns [[1,3],[2,4]].'
        valueRenderOption:
          enum:
          - FORMATTED_VALUE
          - UNFORMATTED_VALUE
          - FORMULA
          type: string
          description: How values should be represented in the output. The default render option is FORMATTED_VALUE.
        dateTimeRenderOption:
          enum:
          - SERIAL_NUMBER
          - FORMATTED_STRING
          type: string
          description: How dates, times, and durations should be represented in the output. This is ignored if valueRenderOption
            is FORMATTED_VALUE. The default dateTime render option is SERIAL_NUMBER.
      additionalProperties: false
  - id: update_chart
    slug: GOOGLESHEETS_UPDATE_CHART
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Update the specification of an existing chart in a Google Sheets spreadsheet. Use this action when
      you need to modify an existing chart's properties such as its title, chart type, data ranges, colors, axes,
      or other visual settings.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - chart_id
      - chart_spec
      properties:
        chart_id:
          type: integer
          description: The unique numeric identifier of the chart to update within the spreadsheet. This is the chartId
            value returned when the chart was created or can be retrieved using the 'Get Spreadsheet Info' action
            (look for sheets[].charts[].chartId in the response). The chart must already exist in the specified spreadsheet.
        chart_spec:
          type: object
          description: 'The complete ChartSpec object defining the updated chart specification. This replaces the
            chart''s existing specification but does not move or resize the chart. Must set exactly one chart type
            field: basicChart, pieChart, bubbleChart, candlestickChart, histogramChart, treemapChart, waterfallChart,
            orgChart, or scorecardChart. To change chart position or size, use a separate UpdateEmbeddedObjectPosition
            request. See https://developers.google.com/sheets/api/reference/rest/v4/spreadsheets/charts#ChartSpec'
          additionalProperties: true
        spreadsheet_id:
          type: string
          description: 'The unique identifier of the Google Sheets spreadsheet containing the chart to update. Must
            be the actual spreadsheet ID from the URL (e.g., ''1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms''), NOT
            the spreadsheet name or title. Find it in the URL: https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/edit'
      additionalProperties: false
  - id: update_dimension_properties
    slug: GOOGLESHEETS_UPDATE_DIMENSION_PROPERTIES
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to hide/unhide rows or columns and set row heights or column widths. Use when you need to change
      visibility or pixel sizing of dimensions in a Google Sheet.
    input_schema:
      type: object
      required:
      - spreadsheet_id
      - dimension
      - start_index
      - end_index
      properties:
        sheet_id:
          type: integer
          description: The numeric ID of the sheet (tab). Either sheet_id or sheet_name must be provided. If both
            are provided, sheet_name will be resolved to sheet_id and override this value.
        dimension:
          enum:
          - ROWS
          - COLUMNS
          type: string
          description: Whether to update rows or columns.
        end_index:
          type: integer
          description: The zero-based end index (exclusive) of the dimension range to update. For example, to update
            rows 5-9, use start_index=5 and end_index=10.
          exclusiveMinimum: 0
        pixel_size:
          type: integer
          description: The height (for rows) or width (for columns) in pixels. Must be a positive integer. At least
            one of hidden_by_user or pixel_size must be provided.
          exclusiveMinimum: 0
        sheet_name:
          type: string
          description: The name of the sheet (tab). If provided, this will be resolved to the numeric sheet_id using
            GOOGLESHEETS_GET_SPREADSHEET_INFO. Either sheet_id or sheet_name must be provided.
        start_index:
          type: integer
          minimum: 0
          description: The zero-based start index (inclusive) of the dimension range to update. For rows, 0 is the
            first row; for columns, 0 is column A.
        hidden_by_user:
          type: boolean
          description: Whether to hide (true) or unhide (false) the specified rows/columns. At least one of hidden_by_user
            or pixel_size must be provided.
        spreadsheet_id:
          type: string
          description: The ID of the spreadsheet to update.
        response_ranges:
          type: array
          items:
            type: string
          description: Limits the ranges included in the response spreadsheet (only if includeSpreadsheetInResponse
            is true).
        response_include_grid_data:
          type: boolean
          description: Whether to include grid data in the response (only if includeSpreadsheetInResponse is true).
        include_spreadsheet_in_response:
          type: boolean
          description: Whether to include the updated spreadsheet in the response.
      additionalProperties: false
  - id: update_sheet_properties
    slug: GOOGLESHEETS_UPDATE_SHEET_PROPERTIES
    version: '20261001_00'
    action_class: write
    capability: sheets.write
    description: Tool to update properties of a sheet (worksheet) within a Google Spreadsheet, such as its title,
      index, visibility, tab color, or grid properties. Use this when you need to modify the metadata or appearance
      of a specific sheet.
    input_schema:
      type: object
      required:
      - spreadsheetId
      - updateSheetProperties
      properties:
        spreadsheetId:
          type: string
          description: The ID of the spreadsheet containing the sheet to update.
        responseRanges:
          type: array
          items:
            type: string
          description: Limits the ranges included in the response spreadsheet. Meaningful only if includeSpreadsheetInResponse
            is true. Ranges should be in A1 notation (e.g., 'Sheet1!A1:B2').
        updateSheetProperties:
          type: object
          required:
          - properties
          properties:
            fields:
              type: string
              description: A comma-separated string specifying which properties to update. Uses FieldMask format.
                For example, to update the title and index, use "title,index". To update all mutable sheet properties,
                use "*". If not provided, fields will be inferred from the properties being updated.
            properties:
              type: object
              required:
              - sheetId
              properties:
                index:
                  type: integer
                  description: The new zero-based index of the sheet.
                title:
                  type: string
                  description: The new title of the sheet.
                hidden:
                  type: boolean
                  description: Whether the sheet should be hidden (true) or visible (false).
                sheetId:
                  type: integer
                  description: The ID of the sheet to update.
                rightToLeft:
                  type: boolean
                  description: 'Toggles the sheet''s layout direction (RTL vs LTR). Note: in practice, updates may
                    only reliably switch RTL → LTR (disable RTL). To enable RTL, create a new sheet with rightToLeft=true
                    (GOOGLESHEETS_ADD_SHEET) and move/copy data into it.'
                tabColorStyle:
                  type: object
                  properties:
                    rgbColor:
                      type: object
                      properties:
                        red:
                          type: number
                          description: The red component of the color, between 0.0 and 1.0.
                        blue:
                          type: number
                          description: The blue component of the color, between 0.0 and 1.0.
                        alpha:
                          type: number
                          description: The alpha component of the color, between 0.0 and 1.0.
                        green:
                          type: number
                          description: The green component of the color, between 0.0 and 1.0.
                      description: Represents a color using RGB values. Specify either rgbColor or themeColor, not
                        both.
                      additionalProperties: false
                    themeColor:
                      enum:
                      - THEME_COLOR_TYPE_UNSPECIFIED
                      - TEXT
                      - BACKGROUND
                      - ACCENT1
                      - ACCENT2
                      - ACCENT3
                      - ACCENT4
                      - ACCENT5
                      - ACCENT6
                      - LINK
                      type: string
                      description: Theme color types available in Google Sheets.
                  description: The new tab color for the sheet.
                  additionalProperties: false
                gridProperties:
                  type: object
                  properties:
                    rowCount:
                      type: integer
                      minimum: 1
                      description: The number of rows in the sheet. Must be at least 1.
                    columnCount:
                      type: integer
                      minimum: 1
                      description: The number of columns in the sheet. Must be at least 1.
                    hideGridlines:
                      type: boolean
                      description: True if gridlines are hidden.
                    frozenRowCount:
                      type: integer
                      minimum: 0
                      description: The number of rows to freeze at the top of the sheet. Must be less than the total
                        number of rows in the sheet (frozenRowCount < rowCount). Setting this value equal to or greater
                        than the total row count will cause an API error.
                    frozenColumnCount:
                      type: integer
                      minimum: 0
                      description: The number of columns to freeze on the left side of the sheet. Must be less than
                        the total number of columns in the sheet (frozenColumnCount < columnCount). Setting this value
                        equal to or greater than the total column count will cause an API error.
                    rowGroupControlAfter:
                      type: boolean
                      description: Whether the row group control toggle appears after the group (true) or before the
                        group (false).
                    columnGroupControlAfter:
                      type: boolean
                      description: Whether the column group control toggle appears after the group (true) or before
                        the group (false).
                  description: Properties of a grid sheet.
                  additionalProperties: false
              description: The properties to update.
              additionalProperties: false
          description: The details of the sheet properties to update.
          additionalProperties: false
        responseIncludeGridData:
          type: boolean
          description: True if grid data should be returned. Meaningful only if includeSpreadsheetInResponse is true.
            When true, the response will include cell data for the specified ranges.
        includeSpreadsheetInResponse:
          type: boolean
          description: Determines if the update response should include the spreadsheet resource. When true, the response
            will include the full updated spreadsheet.
      additionalProperties: false
  - id: update_spreadsheet_properties
