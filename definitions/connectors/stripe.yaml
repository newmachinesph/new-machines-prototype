        limit:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of results per page (default is 10).
        query:
          type: string
          description: The search query string, adhering to Stripe's Search Query Language. This language supports
            features like exact matches, range queries, boolean operators, and searching by metadata. For detailed
            syntax, refer to https://docs.stripe.com/search#search-query-language.
      additionalProperties: false
