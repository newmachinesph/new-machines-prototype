kind: connector
key: stripe
app: Stripe
toolkit: stripe

tools:
  - id: list_charges
    slug: STRIPE_LIST_CHARGES
    version: "20261007_00"
    action_class: read
    capability: payments.read
    description: List card charges created in a time range, with amount, currency, status and refunds.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        created:
          type: object
          additionalProperties: false
          description: Creation time filter. Keys gt, gte, lt, lte hold Unix timestamps in seconds.
          properties:
            gt: {type: integer}
            gte: {type: integer}
            lt: {type: integer}
            lte: {type: integer}
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Charges per page.

  - id: list_invoices
    slug: STRIPE_LIST_INVOICES
    version: "20261007_00"
    action_class: read
    capability: invoices.read
    description: List invoices with their number, customer email, amount due, currency, due date and status.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [draft, open, paid, uncollectible, void]
          description: Only invoices in this status.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Invoices per page.

  # Imported from Composio by scripts/import_connector.py stripe; reviewed choices are in
  # scripts/connector_imports/stripe.yaml.
  - id: create_customer
    slug: STRIPE_CREATE_CUSTOMER
    version: '20261014_00'
    action_class: write
    capability: payments.write
    description: Creates a new customer in Stripe, required for creating charges or subscriptions; an email is highly
      recommended for customer communications.
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: The customer's full name or the name of the business.
        email:
          type: string
          description: The customer's primary email address, used by Stripe for sending invoices, receipts, and other
            important communications.
        phone:
          type: string
          description: The customer's primary phone number. Include the country code for international numbers (e.g.,
            +1 for the USA).
        address:
          type: object
          description: 'The customer''s billing address, provided as a dictionary where both keys and values are strings.
            This address can be used for tax calculation, shipping, and fraud prevention. Common keys include: `line1`
            (street address, P.O. box, or c/o), `line2` (apartment, suite, unit, or building), `city`, `state` (state,
            province, or region), `postal_code` (ZIP or postal code), and `country` (a two-letter ISO country code,
            e.g., ''US'', ''GB''). All keys are optional. Can be provided as either a dictionary or a JSON string.'
          additionalProperties:
            type: string
        description:
          type: string
          description: An arbitrary string that you can attach to a customer object for your internal reference (e.g.,
            notes about the customer). This is not visible to the customer.
      additionalProperties: false
  - id: create_customer_tax_id
    slug: STRIPE_CREATE_CUSTOMER_TAX_ID
    version: '20261014_00'
    action_class: write
    capability: payments.write
    description: Creates a new tax ID for a customer, used for tax compliance and invoicing across 100+ supported
      country-specific tax ID formats. Use when you need to add tax identification to a customer account.
    input_schema:
      type: object
      required:
      - customer
      - type
      - value
      properties:
        type:
          type: string
          description: 'Type of the tax ID. Supported values include over 100 country-specific formats such as: eu_vat
            (European VAT number), us_ein (US Employer Identification Number), gb_vat (United Kingdom VAT number),
            ca_bn (Canadian Business Number), br_cpf (Brazilian CPF number), in_gst (Indian GST number), jp_cn (Japanese
            Corporate Number), ad_nrt, ae_trn, ar_cuit, au_abn, au_arn, bg_uic, bh_vat, bo_tin, br_cnpj, ch_vat, cl_tin,
            cn_tin, co_nit, cr_tin, de_stn, do_rcn, ec_ruc, eg_tin, es_cif, eu_oss_vat, ge_vat, hk_br, hu_tin, id_npwp,
            il_vat, is_vat, ke_pin, kr_brn, kz_bin, li_uid, mx_rfc, my_frp, my_itn, my_sst, ng_tin, no_vat, no_voec,
            nz_gst, om_vat, pe_ruc, ph_tin, ro_tin, rs_pib, ru_inn, ru_kpp, sa_vat, sg_gst, sg_uen, si_tin, sv_nit,
            th_vat, tr_tin, tw_vat, ua_vat, uy_ruc, ve_rif, vn_tin, za_vat and many more.'
        value:
          type: string
          description: The value of the tax ID number.
        customer:
          type: string
          description: The ID of the customer for whom to create the tax ID. Must start with 'cus_' followed by alphanumeric
            characters.
      additionalProperties: false
  - id: create_price
    slug: STRIPE_CREATE_PRICE
    version: '20261014_00'
    action_class: write
    capability: payments.write
    description: Creates a new Stripe Price for a product, defining its charges (one-time or recurring) and billing
      scheme; requires either an existing `product` ID or `product_data`.
    input_schema:
      type: object
      required:
      - currency
      properties:
        tiers:
          type: array
          items:
            type: object
            required:
            - up_to
            properties:
              up_to:
                anyOf:
                - type: integer
                - type: string
                description: Specifies the upper bound of this tier. Can be an integer or 'inf' for the last tier
                  (fallback tier).
              flat_amount:
                type: integer
                description: The flat billing amount for an entire tier (in the smallest currency unit), if any. Cannot
                  be used with `unit_amount`.
              unit_amount:
                type: integer
                description: The per-unit billing amount in the smallest currency unit for this tier. Cannot be used
                  with `flat_amount`.
              flat_amount_decimal:
                type: string
                description: Same as `flat_amount`, but accepts a decimal string with up to 12 decimal places. Suitable
                  for higher precision.
              unit_amount_decimal:
                type: string
                description: Same as `unit_amount`, but accepts a decimal string with up to 12 decimal places. Suitable
                  for higher precision.
            description: Represents a pricing tier for tiered billing (`billing_scheme = 'tiered'`).
            additionalProperties: false
          description: A list of pricing tiers. Required if `billing_scheme` is 'tiered'.
        active:
          type: boolean
          description: Whether the price can be used for new purchases. Defaults to true.
        product:
          type: string
          description: The ID of the product this price is for. Required if `product_data` is not provided.
        currency:
          type: string
          description: Three-letter ISO currency code (e.g., 'usd', 'eur'). Must be a supported currency.
        metadata:
          type: object
          description: A set of key-value pairs to store additional information about the price.
          additionalProperties:
            type: string
        nickname:
          type: string
          description: A brief, internal-facing description of the price. Useful for distinguishing prices in listings.
        recurring:
          type: object
          required:
          - interval
          properties:
            meter:
              type: string
              description: The ID of the meter from which to read usage when `usage_type=metered`. Required if `usage_type='metered'`
                and not using `product.meter`.
            interval:
              type: string
              description: Specifies the billing frequency. Must be one of 'day', 'week', 'month', or 'year'.
            usage_type:
              type: string
              description: Configures how usage is calculated. Set to 'metered' to bill based on usage, or 'licensed'
                for a fixed quantity. Defaults to 'licensed'.
            interval_count:
              type: integer
              description: The number of intervals between subscription billings. For example, `interval=month` and
                `interval_count=3` bills every 3 months. Defaults to 1.
            aggregate_usage:
              type: string
              description: For `usage_type=metered`, specifies how usage records are aggregated. Options include 'sum',
                'last_during_period', 'last_ever', or 'max'. Defaults to 'sum'. This field is ignored if `usage_type`
                is 'licensed'.
          description: Specifies recurring components of a price, such as billing interval and usage type.
          additionalProperties: false
        lookup_key:
          type: string
          description: A unique, user-defined key to retrieve this price. Case-sensitive.
        tiers_mode:
          type: string
          description: Defines how the quantity is applied to the tiers. Either 'graduated' (price is sum of costs
            from applicable tiers) or 'volume' (price is determined by the tier corresponding to the total quantity).
            Required if `billing_scheme` is 'tiered'.
        unit_amount:
          type: integer
          description: The base charge amount in the smallest currency unit (e.g., cents for USD). Required if not
            using `tiers`, `custom_unit_amount`, or `currency_options` with a unit amount for the primary currency.
        product_data:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: The product’s name, meant to be displayable to the customer.
            active:
              type: boolean
              description: Whether the product is currently available for purchase. Defaults to true.
            metadata:
              type: object
              description: A set of key-value pairs to store additional information about the product.
              additionalProperties:
                type: string
            tax_code:
              type: string
              description: A tax code ID that identifies the taxability of this product. Recommended for products
                that are subject to tax.
            unit_label:
              type: string
              description: A label that represents units of this product. For example, 'user' or 'GB'.
            statement_descriptor:
              type: string
              description: An arbitrary string to be displayed on the customer's credit card statement. This field
                is not available for all payment methods.
          description: Fields for creating a new product if a `product` ID is not provided with the price.
          additionalProperties: false
        tax_behavior:
          type: string
          description: Specifies how tax is applied to the price. Options are 'inclusive' (tax is included), 'exclusive'
            (tax is added), or 'unspecified'.
        billing_scheme:
          type: string
          description: Describes how to compute the price per period. Either 'per_unit' (default, for fixed price
            per unit) or 'tiered' (for volume-based or graduated tiers).
        currency_options:
          type: object
          description: Prices defined in each supported currency. Useful for multi-currency pricing. The primary `currency`'s
            pricing can also be defined here.
          additionalProperties:
            type: object
            properties:
              tiers:
                anyOf:
                - type: array
                  items:
                    type: object
                    required:
                    - up_to
                    properties:
                      up_to:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Specifies the upper bound of this tier for the specific currency. Use 'inf' for
                          the last tier.
                      flat_amount:
                        anyOf:
                        - type: integer
                        - type: 'null'
                        description: The flat billing amount for this tier in the currency (smallest unit).
                      unit_amount:
                        anyOf:
                        - type: integer
                        - type: 'null'
                        description: The per-unit billing amount for this tier in the currency (smallest unit).
                      flat_amount_decimal:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Decimal string representation of `flat_amount` for this tier in the currency.
                      unit_amount_decimal:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Decimal string representation of `unit_amount` for this tier in the currency.
                    description: Defines pricing tiers for a specific currency within `currency_options`.
                    additionalProperties: false
                - type: 'null'
                description: A list of pricing tiers for this currency, if `billing_scheme` is 'tiered'.
              unit_amount:
                anyOf:
                - type: integer
                - type: 'null'
                description: The unit amount in the smallest currency unit for this currency. Required if not using
                  `tiers` or `custom_unit_amount`.
              tax_behavior:
                anyOf:
                - type: string
                - type: 'null'
                description: Specifies whether the price already includes tax ('inclusive'), tax is added on top ('exclusive'),
                  or tax behavior is not specified ('unspecified').
              custom_unit_amount:
                anyOf:
                - type: object
                  required:
                  - enabled
                  properties:
                    preset:
                      anyOf:
                      - type: integer
                      - type: 'null'
                      description: The starting unit amount (in the smallest currency unit) that can be updated by
                        the customer. This is the initial value presented.
                    enabled:
                      type: boolean
                      description: Pass `true` to enable `custom_unit_amount`, allowing the customer to set the price.
                    maximum:
                      anyOf:
                      - type: integer
                      - type: 'null'
                      description: The maximum unit amount (in the smallest currency unit) the customer can specify.
                    minimum:
                      anyOf:
                      - type: integer
                      - type: 'null'
                      description: The minimum unit amount (in the smallest currency unit) the customer can specify.
                  description: Configuration for a price where the unit amount is set by the customer at checkout.
                  additionalProperties: false
                - type: 'null'
                description: Configuration for a customer-defined unit amount for this currency.
              unit_amount_decimal:
                anyOf:
                - type: string
                - type: 'null'
                description: Decimal string representation of `unit_amount` for this currency. Provides higher precision.
            description: Defines pricing details for a specific currency, used in `currency_options`.
            additionalProperties: false
        custom_unit_amount:
          type: object
          required:
          - enabled
          properties:
            preset:
              type: integer
              description: The starting unit amount (in the smallest currency unit) that can be updated by the customer.
                This is the initial value presented.
            enabled:
              type: boolean
              description: Pass `true` to enable `custom_unit_amount`, allowing the customer to set the price.
            maximum:
              type: integer
              description: The maximum unit amount (in the smallest currency unit) the customer can specify.
            minimum:
              type: integer
              description: The minimum unit amount (in the smallest currency unit) the customer can specify.
          description: Configuration for a price where the unit amount is set by the customer at checkout.
          additionalProperties: false
        transform_quantity:
          type: object
          required:
          - divide_by
          - round
          properties:
            round:
              type: string
              description: After division, specifies how the result should be rounded. Must be one of 'up' or 'down'.
            divide_by:
              type: integer
              description: Divide the reported usage quantity by this number.
          description: Contains information about how the quantity should be transformed before calculating the price.
          additionalProperties: false
        unit_amount_decimal:
          type: string
          description: Same as `unit_amount`, but accepts a decimal string with up to 12 decimal places for higher
            precision. Required if not using `tiers`, `custom_unit_amount`, or `currency_options` with a unit amount
            for the primary currency and `unit_amount` is not provided.
      additionalProperties: false
  - id: create_product
    slug: STRIPE_CREATE_PRODUCT
    version: '20261014_00'
    action_class: write
    capability: payments.write
    description: Creates a new product in Stripe, encoding the request as `application/x-www-form-urlencoded` by flattening
      nested structures.
    input_schema:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          description: Optional unique product identifier. Stripe generates one if omitted. Useful for idempotency
            or migrating existing IDs.
        url:
          type: string
          description: Publicly accessible URL for the product's webpage or landing page.
        name:
          type: string
          description: Product's name, displayed to customers.
        active:
          type: boolean
          description: Indicates if the product is available for purchase. Set to `false` to archive.
        images:
          type: array
          items:
            type: string
          description: Up to 8 image URLs for display on product pages or checkout.
        metadata:
          type: object
          description: Key-value pairs for storing additional structured information.
          additionalProperties:
            type: string
        tax_code:
          type: string
          description: Stripe tax code ID for determining tax rates on sales.
        shippable:
          type: boolean
          description: Indicates if the product is a physical good requiring shipping.
        unit_label:
          type: string
          description: Label for product units to clarify quantity-based pricing.
        description:
          type: string
          description: Product description, displayed to customers, providing more details.
        custom_fields:
          type: array
          items:
            type: object
            required:
            - name
            - value
            properties:
              name:
                type: string
                description: Name of the custom field for invoices.
              value:
                type: string
                description: Value of the custom field.
            description: Represents a custom field to be displayed on invoices for sales of this product.
            additionalProperties: false
          description: Custom fields displayed on invoices for sales (e.g., PO numbers).
        shipping_cost:
          type: object
          properties:
            shipping_rate:
              type: string
              description: ID of an existing ShippingRate. If provided, `shipping_rate_data` must be omitted.
            shipping_rate_data:
              type: object
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  description: Shipping rate name displayed to customer.
              description: Parameters for creating a new ad-hoc shipping rate during product creation.
              additionalProperties: false
          description: Defines the shipping cost for the product, either by referencing an existing shipping rate
            or creating a new one.
          additionalProperties: false
        default_price_data:
          type: object
          required:
          - currency
          properties:
            currency:
              type: string
              description: Three-letter ISO currency code, lowercase. Must be a supported currency.
            recurring:
              type: object
              required:
              - interval
              properties:
                interval:
                  type: string
                  description: 'Frequency of subscription billing. Must be one of: `day`, `week`, `month`, or `year`.'
                interval_count:
                  type: integer
                  description: Number of intervals between billings (e.g., `interval=month`, `interval_count=3` bills
                    every 3 months). Defaults to 1 if not provided.
              description: Specifies a recurring payment plan for a price.
              additionalProperties: false
            unit_amount:
              type: integer
              description: Price in smallest currency unit (e.g., cents for USD). Zero allowed for free price.
            tax_behavior:
              type: string
              description: 'Tax treatment of the price. Must be one of: `inclusive`, `exclusive`, or `unspecified`
                (inherited from customer/subscription).'
            currency_options:
              type: object
              description: Per-currency pricing options. Keys are three-letter ISO currency codes. Values are dicts
                with price properties (e.g., `unit_amount`, `tax_behavior`) for that currency.
              additionalProperties: true
            custom_unit_amount:
              type: object
              description: Configuration for customer-adjustable unit amount (Checkout/Payment Links). Requires `enabled=True`.
                Can include `minimum`, `maximum`, `preset`.
              additionalProperties: true
            unit_amount_decimal:
              type: string
              description: Price as a decimal in smallest currency unit (max 12 decimal places). For fractions of
                a cent.
          description: Data used to create a new Price object as the default price for this product.
          additionalProperties: false
        marketing_features:
          type: array
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: Name of the marketing feature (max 80 characters).
            description: Represents a marketing feature to be displayed on the product page or pricing table.
            additionalProperties: false
          description: List of marketing features; short, benefit-oriented statements for pricing pages.
        package_dimensions:
          type: object
          required:
          - height
          - length
          - width
          - weight
          properties:
            width:
              type: number
              minimum: 0
              description: Package width in inches (max 2 decimal places).
            height:
              type: number
              minimum: 0
              description: Package height in inches (max 2 decimal places).
            length:
              type: number
              minimum: 0
              description: Package length in inches (max 2 decimal places).
            weight:
              type: number
              minimum: 0
              description: Package weight in ounces (max 2 decimal places).
          description: The dimensions of the product for shipping purposes. Required if the product is shippable and
            you use a shipping rate that calculates shipping costs based on dimensions.
          additionalProperties: false
        statement_descriptor:
          type: string
          description: String (max 22 chars) for customer credit card statements for charge recognition.
      additionalProperties: false
  - id: download_file_contents
    slug: STRIPE_DOWNLOAD_FILE_CONTENTS
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Download authenticated file contents when the file purpose permits it.
    input_schema:
      type: object
      required:
      - file_id
      properties:
        file_id:
          type: string
          description: The Stripe file ID to download. This ID typically starts with 'file_'.
      additionalProperties: false
  - id: download_quote_pdf
    slug: STRIPE_DOWNLOAD_QUOTE_PDF
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Tool to download the PDF for a finalized quote from Stripe. Use when you need to retrieve the PDF
      document of a quote that has been finalized.
    input_schema:
      type: object
      required:
      - quote
      properties:
        quote:
          type: string
          description: The ID of the finalized quote to download as PDF. Must start with 'qt_'.
      additionalProperties: false
  - id: get_charge_refund_details
    slug: STRIPE_GET_CHARGES_CHARGE_REFUNDS_REFUND
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Tool to retrieve the details of an existing refund within a specific charge. Use when you need to
      get refund information using both the charge ID and refund ID.
    input_schema:
      type: object
      required:
      - charge
      - refund
      properties:
        charge:
          type: string
          description: The identifier of the charge that contains the refund. This ID typically starts with 'ch_'.
        expand:
          type: array
          items:
            type: string
          description: 'Specifies which fields in the response should be expanded. Expandable fields include: balance_transaction,
            charge, destination_details, failure_balance_transaction, next_action, payment_intent, presentment_details,
            source_transfer_reversal, transfer_reversal.'
        refund:
          type: string
          description: The identifier of the refund to retrieve. This ID typically starts with 're_'.
      additionalProperties: false
  - id: retrieve_customer_bank_account
    slug: STRIPE_GET_CUSTOMERS_CUSTOMER_BANK_ACCOUNTS_ID
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Retrieves details about a specific bank account stored on a Stripe customer. Use when you need to
      view bank account information for a customer.
    input_schema:
      type: object
      required:
      - customer
      - id
      properties:
        id:
          type: string
          description: The unique identifier for the bank account to retrieve. Must start with 'ba_' followed by alphanumeric
            characters.
        expand:
          type: array
          items:
            type: string
          description: Specifies which fields in the response should be expanded. Supports expansion of related objects
            and nested fields up to 4 levels deep.
        customer:
          type: string
          description: The unique identifier for the customer. Must start with 'cus_' followed by alphanumeric characters.
      additionalProperties: false
  - id: get_customer_cash_balance
    slug: STRIPE_GET_CUSTOMERS_CUSTOMER_CASH_BALANCE
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Tool to retrieve a customer's cash balance. Use when you need to check the current cash balance for
      a specific Stripe customer, including available funds by currency.
    input_schema:
      type: object
      required:
      - customer
      properties:
        expand:
          type: array
          items:
            type: string
          description: Specifies which fields in the response should be expanded. Each string in the array can be
            a field path to expand.
        customer:
          type: string
          description: The unique identifier of the customer whose cash balance to retrieve (e.g., cus_TepEFWlTGw5ves).
      additionalProperties: false
  - id: list_customer_payment_methods
    slug: STRIPE_GET_CUSTOMERS_CUSTOMER_PAYMENT_METHODS
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Retrieves a list of payment methods for a given customer, supporting type filtering and pagination.
    input_schema:
      type: object
      required:
      - customer_id
      properties:
        type:
          type: string
          description: Filters the list by payment method type (e.g., 'card', 'sepa_debit').
        limit:
          type: integer
          maximum: 100
          minimum: 1
          description: Limit on the number of payment methods returned. If not specified, Stripe's default limit (typically
            10) applies.
        customer_id:
          type: string
          description: The unique identifier of the customer whose payment methods are to be retrieved.
        ending_before:
          type: string
          description: Pagination cursor; ID of the first object from a previous request to fetch the preceding page.
        starting_after:
          type: string
          description: Pagination cursor; ID of the last object from a previous request to fetch the next page.
        allow_redisplay:
          enum:
          - always
          - limited
          - unspecified
          type: string
          description: Filter results by the value of allow_redisplay on the payment methods.
      additionalProperties: false
  - id: get_customer_subscription_discount
    slug: STRIPE_GET_CUSTOMERS_CUSTOMER_SUBS_SUB_EXPOSED_ID_DISCOUNT
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Tool to retrieve the discount currently applied to a customer's subscription. Use when you need to
      check if a subscription has an active discount and get details about the coupon or promotion code.
    input_schema:
      type: object
      required:
      - customer
      - subscription_exposed_id
      properties:
        expand:
          type: array
          items:
            type: string
          description: Specifies which fields in the response should be expanded. For example, use 'coupon' to expand
            the coupon details within the discount object.
        customer:
          type: string
          pattern: ^cus_[a-zA-Z0-9]+$
          description: The ID of the customer. Must start with 'cus_' followed by alphanumeric characters.
        subscription_exposed_id:
          type: string
          pattern: ^sub_[a-zA-Z0-9]+$
          description: The unique identifier of the subscription. This is the subscription ID starting with 'sub_'.
      additionalProperties: false
  - id: retrieve_invoice
    slug: STRIPE_GET_INVOICES_INVOICE
    version: '20261014_00'
    action_class: read
    capability: payments.read
    description: Tool to retrieve a specific invoice by ID. Use when you need to get detailed information about an
      existing invoice.
    input_schema:
      type: object
      required:
      - invoice
      properties:
        expand:
