  - id: retrieve_upcoming_invoice
    slug: STRIPE_RETRIEVE_UPCOMING_INVOICE
    version: '20261014_00'
    name: Preview upcoming invoice
    action_class: read
    capability: payments.read
    description: Preview the next invoice for a customer or subscription before it is created, showing pending charges
      such as subscription renewals and invoice items, with optional changes to try out.
    input_schema:
      type: object
      properties:
        coupon:
          type: string
          description: The code of the coupon to apply to the invoice preview. If multiple discounts needed, use the
            discounts parameter instead.
        issuer:
          type: object
          description: The connected account that issues the invoice. Can specify type ('self' or 'account') and account
            ID.
          additionalProperties:
            type: string
        currency:
          type: string
          description: The currency for the invoice preview. Three-letter ISO currency code. Defaults to customer's
            currency.
        customer:
          type: string
          description: The identifier of the customer whose upcoming invoice to retrieve. Required if subscription
            is not specified.
        schedule:
          type: string
          description: The identifier of the subscription schedule for which you'd like to retrieve the upcoming invoice.
            Cannot be combined with subscription or subscription_details parameters.
        discounts:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          description: List of discounts to apply. Each discount can have coupon, discount, or promotion_code.
        on_behalf_of:
          type: string
          description: The account (if any) for which the funds of the invoice payment are intended. Used with Stripe
            Connect.
        preview_mode:
          type: string
          description: Determines the preview calculation type. 'next' (default) calculates the next invoice with
            all items. 'recurring' estimates long-term recurring bill.
        subscription:
          type: string
          description: The identifier of the subscription for which you'd like to retrieve the upcoming invoice. If
            not specified, uses the customer's default subscription.
        automatic_tax:
          type: object
          description: Settings for automatic tax calculation. Must include 'enabled' boolean field.
          additionalProperties:
            type: boolean
        invoice_items:
          type: array
          items:
            type: object
            additionalProperties:
              anyOf:
              - type: string
              - type: integer
              - type: boolean
          description: List of invoice items to add or update in the upcoming invoice preview. Maximum 250 items.
        customer_details:
          type: object
          description: Details about the customer used for this invoice preview. Can include address, shipping, and
            tax information.
          additionalProperties:
            type: string
        schedule_details:
          type: object
          description: Details for schedule creation or modification to preview. Include phases, end_behavior, and
            proration_behavior.
          additionalProperties:
            anyOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: integer
        subscription_items:
          type: array
          items:
            type: object
            additionalProperties:
              anyOf:
              - type: string
              - type: integer
              - type: boolean
          description: List of subscription items for subscription updates. Each item can have id, deleted, price,
            quantity, etc.
        subscription_details:
          type: object
          description: Subscription creation or modification parameters to preview. Can include items, proration_behavior,
            proration_date, billing_cycle_anchor, trial_end, etc.
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: boolean
            - type: array
              items:
                type: object
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: integer
        subscription_cancel_at:
          type: integer
          description: Unix timestamp at which the subscription should be canceled. Used to preview the invoice that
            will be generated if the subscription is canceled at this time.
        subscription_resume_at:
          type: string
          description: For paused subscriptions, when to resume. Can be 'now'.
        subscription_trial_end:
          anyOf:
          - type: integer
          - type: string
          description: Trial end for the subscription. Can be 'now' or a Unix timestamp.
        subscription_cancel_now:
          type: boolean
          description: Boolean to simulate immediate cancellation of the subscription.
        subscription_start_date:
          type: integer
          description: Unix timestamp for when the subscription should start.
        subscription_proration_date:
          type: integer
          description: 'Unix timestamp to use for proration calculations. Important: Use this same value when doing
            the actual subscription update to ensure matching prorations.'
        subscription_trial_from_plan:
          type: boolean
          description: Boolean indicating if a default trial from the plan should be applied.
        subscription_default_tax_rates:
          type: array
          items:
            type: string
          description: List of tax rate IDs to apply to the subscription items in this preview.
        subscription_proration_behavior:
          type: string
          description: How to handle prorations when updating subscriptions. Can be 'create_prorations', 'none', or
            'always_invoice'.
        subscription_billing_cycle_anchor:
          anyOf:
          - type: integer
          - type: string
          description: For new subscriptions, billing cycle anchor. Can be 'now', 'unchanged', or a Unix timestamp.
        subscription_cancel_at_period_end:
          type: boolean
          description: Boolean indicating whether the subscription should cancel at the end of the current period.
      additionalProperties: false
  - id: search_customers
    slug: STRIPE_SEARCH_CUSTOMERS
    version: '20261014_00'
    name: Search customers
    action_class: read
    capability: payments.read
    description: Search customers with a query on fields such as email address, name or metadata, in the payment provider's
      search syntax, a page at a time.
    input_schema:
      type: object
      required:
      - query
      properties:
        page:
          type: string
          description: Cursor token for pagination. MUST be the exact `next_page` value from a previous search response
            - NOT a numeric page number like '1' or '2'. Omit this parameter on the first request. Only provide this
            when `has_more` is true in the previous response.
        limit:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of results per page (default is 10).
        query:
          type: string
          minLength: 1
          description: 'The search query string using Stripe''s Search Query Language. IMPORTANT: Every query must
            include at least one field:value condition - standalone wildcards like ''*'' are NOT supported and will
            fail. Supported operators: '':'' for exact match (case-insensitive), ''~'' for substring match (minimum
            3 characters), comparison operators (>, <, >=, <=) for numeric/date fields. Combine clauses with AND,
            OR, or prefix with ''-'' for negation. To retrieve many/all customers, use ''created>0''. For partial
            text matching, use the ~ operator (e.g., email~''example'').'
      additionalProperties: false
  - id: search_payment_intents
    slug: STRIPE_SEARCH_PAYMENT_INTENTS
    version: '20261014_00'
