kind: connector
key: gmail
app: Gmail
toolkit: gmail

tools:
  - id: list_threads
    slug: GMAIL_FETCH_EMAILS
    version: "20261010_00"
    action_class: read
    capability: mail.read
    description: List recent emails in the inbox that match a search query, with sender, subject, date and text.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          description: Mailbox search query, such as refund or from:someone@example.com.
        max_results:
          type: integer
          minimum: 1
          maximum: 100
          description: Most emails to return.

  - id: create_draft
    slug: GMAIL_CREATE_EMAIL_DRAFT
    version: "20261010_00"
    action_class: write
    capability: mail.write
    description: Save an email as a draft for a person to review and send. Nothing is sent.
    input_schema:
      type: object
      additionalProperties: false
      required: [recipient_email, subject, body]
      properties:
        recipient_email:
          type: string
          minLength: 3
          description: The address the draft is to.
        subject:
          type: string
          minLength: 1
          maxLength: 150
          description: The subject line.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The plain-text body.

  - id: send_email
    slug: GMAIL_SEND_EMAIL
    version: "20261010_00"
    action_class: write
    capability: mail.send
    description: Send a plain-text email from the connected account. It is sent at once.
    input_schema:
      type: object
      additionalProperties: false
      required: [recipient_email, subject, body]
      properties:
        recipient_email:
          type: string
          minLength: 3
          description: The address the email is to.
        subject:
          type: string
          minLength: 1
          maxLength: 150
          description: The subject line.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The plain-text body.

defaults: {read: permit, write: require_approval, delete: deny, money: deny}
