kind: connector
key: gmail
app: Gmail
toolkit: gmail

tools:
  - id: list_threads
    slug: GMAIL_FETCH_EMAILS
    version: "20261010_00"
    # The id stays (packs and sandbox fixtures name it); the Studio shows the name, which says what it does.
    name: List emails
    action_class: read
    capability: mail.read
    description: List recent emails in the inbox that match a search query, with sender, subject, date and text.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          description: Mailbox search query, such as refund or from:someone@example.com.
        max_results:
          type: integer
          minimum: 1
          maximum: 100
          description: Most emails to return.

  - id: create_draft
    slug: GMAIL_CREATE_EMAIL_DRAFT
    version: "20261010_00"
    action_class: write
    capability: mail.write
    description: Save an email as a draft for a person to review and send. Nothing is sent.
    input_schema:
      type: object
      additionalProperties: false
      required: [recipient_email, subject, body]
      properties:
        recipient_email:
          type: string
          minLength: 3
          description: The address the draft is to.
        subject:
          type: string
          minLength: 1
          maxLength: 150
          description: The subject line.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The plain-text body.

  - id: send_email
    slug: GMAIL_SEND_EMAIL
    version: "20261010_00"
    action_class: write
    capability: mail.send
    description: Send a plain-text email from the connected account. It is sent at once.
    input_schema:
      type: object
      additionalProperties: false
      required: [recipient_email, subject, body]
      properties:
        recipient_email:
          type: string
          minLength: 3
          description: The address the email is to.
        subject:
          type: string
          minLength: 1
          maxLength: 150
          description: The subject line.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The plain-text body.

  # Imported from Composio by scripts/import_connector.py gmail; reviewed choices are in
  # scripts/connector_imports/gmail.yaml.
  - id: modify_email_labels
    slug: GMAIL_ADD_LABEL_TO_EMAIL
    version: '20261015_00'
    action_class: write
    capability: mail.write
    description: Adds and/or removes specified Gmail labels for a message; ensure `message_id` and all `label_ids`
      are valid (use 'listLabels' for custom label IDs).
    input_schema:
      type: object
      required:
      - message_id
      properties:
        user_id:
          type: string
          description: User's email address or 'me' for the authenticated user.
        message_id:
          type: string
          pattern: ^[0-9a-fA-F]+$
          description: 'Immutable ID of the message to modify. Gmail message IDs are hexadecimal strings (e.g., ''1a2b3c4d5e6f7890'').
            IMPORTANT: Do NOT use UUIDs (32-character strings like ''093ca4662b214d5eba8f4ceeaad63433''), thread IDs,
            or internal system IDs - these will cause ''Invalid id value'' errors. Obtain valid message IDs from:
            (1) ''GMAIL_FETCH_EMAILS'' response ''messageId'' field, (2) ''GMAIL_FETCH_MESSAGE_BY_THREAD_ID'' response,
            or (3) ''GMAIL_LIST_THREADS'' and then fetching thread messages.'
        add_label_ids:
          type: array
          items:
            type: string
            pattern: ^(?!(?:[Tt][Rr][Aa][Ss][Hh]|[Ss][Pp][Aa][Mm])$).+$
          description: 'Label IDs to add (IDs, not display names). System labels: INBOX, SPAM, TRASH, UNREAD, STARRED,
            IMPORTANT, CATEGORY_PERSONAL, CATEGORY_SOCIAL, CATEGORY_PROMOTIONS, CATEGORY_UPDATES, CATEGORY_FORUMS.
            Use full CATEGORY_ prefix (e.g., ''CATEGORY_UPDATES'' not ''UPDATES''). Custom labels: call ''listLabels''
            first to get the ID (format: ''Label_<number>''). Do NOT use the label display name; the API requires
            the ID. SENT, DRAFT, CHAT are immutable and cannot be added or removed. A label cannot appear in both
            add_label_ids and remove_label_ids.'
        remove_label_ids:
          type: array
          items:
            type: string
          description: 'Label IDs to remove (IDs, not display names). System labels: INBOX, SPAM, TRASH, UNREAD, STARRED,
            IMPORTANT, CATEGORY_PERSONAL, CATEGORY_SOCIAL, CATEGORY_PROMOTIONS, CATEGORY_UPDATES, CATEGORY_FORUMS.
            Use full CATEGORY_ prefix (e.g., ''CATEGORY_UPDATES'' not ''UPDATES''). Custom labels: call ''listLabels''
            first to get the ID (format: ''Label_<number>''). SENT, DRAFT, CHAT are immutable and cannot be removed.
            Common operations: to mark as read, remove ''UNREAD''; to archive, remove ''INBOX''. A label cannot appear
            in both add_label_ids and remove_label_ids.'
      additionalProperties: false
  - id: batch_modify_gmail_messages
    slug: GMAIL_BATCH_MODIFY_MESSAGES
    version: '20261015_00'
    action_class: write
    capability: mail.write
    description: Modify labels on multiple Gmail messages in one efficient API call. Supports up to 1,000 messages
      per request for bulk operations like archiving, marking as read/unread, or applying custom labels.
    input_schema:
      type: object
      required:
      - messageIds
      properties:
        userId:
          type: string
          description: User's email address or 'me' for the authenticated user.
        messageIds:
          type: array
          items:
            type: string
          maxItems: 1000
          minItems: 1
          description: List of message IDs to modify. Maximum 1,000 message IDs per request. Get message IDs from
            GMAIL_FETCH_EMAILS or GMAIL_LIST_THREADS actions. Accepts 'messageIds', 'ids', or 'message_ids' as the
            parameter name.
        addLabelIds:
          type: array
          items:
            type: string
            pattern: ^(?!(?:[Tt][Rr][Aa][Ss][Hh]|[Ss][Pp][Aa][Mm])$).+$
          description: 'List of label IDs to add to the messages. IMPORTANT: Use label IDs, NOT label display names.
            System labels use their name as ID: INBOX, STARRED, IMPORTANT, SENT, DRAFT, SPAM, TRASH, UNREAD, CATEGORY_PERSONAL,
            CATEGORY_SOCIAL, CATEGORY_PROMOTIONS, CATEGORY_UPDATES, CATEGORY_FORUMS. Custom labels MUST use their
            ID (format: ''Label_XXX'', e.g., ''Label_1'', ''Label_25''), NOT the display name (e.g., do NOT use ''Work''
            or ''Projects''). Call GMAIL_LIST_LABELS first to get the ''id'' field for custom labels. At least one
            of add_label_ids or remove_label_ids must be provided. CONSTRAINT: Label IDs must NOT overlap with remove_label_ids
            - cannot add and remove the same label.'
        removeLabelIds:
          type: array
          items:
            type: string
          description: 'List of label IDs to remove from the messages. IMPORTANT: Use label IDs, NOT label display
            names. System labels use their name as ID: INBOX, STARRED, IMPORTANT, SENT, SPAM, TRASH, UNREAD. Custom
            labels MUST use their ID (format: ''Label_XXX'', e.g., ''Label_1'', ''Label_25''), NOT the display name
            (e.g., do NOT use ''Work'' or ''Projects''). Call GMAIL_LIST_LABELS first to get the ''id'' field for
            custom labels. Common use cases: Remove ''UNREAD'' to mark as read, remove ''INBOX'' to archive. Note:
            ''DRAFT'' cannot be removed - use GMAIL_DELETE_DRAFT instead. At least one of add_label_ids or remove_label_ids
            must be provided. CONSTRAINT: Label IDs must NOT overlap with add_label_ids - cannot add and remove the
            same label.'
      additionalProperties: false
  - id: create_label
    slug: GMAIL_CREATE_LABEL
    version: '20261015_00'
    action_class: write
    capability: mail.write
    description: Creates a new label with a unique name in the specified user's Gmail account.
    input_schema:
      type: object
      required:
      - label_name
      properties:
        user_id:
          type: string
          description: The email address of the user in whose account the label will be created.
        label_name:
          type: string
          description: 'REQUIRED. The name for the new label. Must be unique within the account, non-blank, maximum
            length 225 characters, cannot contain commas ('',''), not only whitespace, and must not be a reserved
            system label. Reserved English system labels include: Inbox, Starred, Important, Sent, Draft, Drafts,
            Spam, Trash, etc. Forward slashes (''/'') are allowed and used to create hierarchical nested labels (e.g.,
            ''Work/Projects'', ''Personal/Finance''). When creating nested labels, any missing parent labels will
            be automatically created (similar to ''mkdir -p''). Periods (''.'') are allowed and commonly used for
            numbering schemes (e.g., ''1. Action Items'', ''2. Projects''). Note: ''name'' is also accepted as an
            alias for this field. If a label with this name already exists, returns a 409 conflict; use GMAIL_LIST_LABELS
            to check existing labels and reuse the existing labelId, or use GMAIL_PATCH_LABEL to update it.'
