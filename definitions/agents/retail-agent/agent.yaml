kind: agent
key: retail-agent
schema_version: nm.agent.manifest.v1.1
agent_id: retail-agent
version: "1.1.0"
publisher_id: new-machines-labs
publisher_name: New Machines Labs
name: Retail Agent
summary: >-
  Reads your store's orders for a date range and points out the ones that look unusual, naming each order and why it stands out. It only reads orders and never changes them.
capabilities: [retail.orders]
runtime:
  adapter: google_adk
  model_profile: reasoning
  instructions: instructions.md
  skills: [skills/read-orders.md, skills/spot-anomalies.md]
  tools: [shopify.list_orders]
  max_turns: 6
input_schema_ref: order-payment-reconciliation/input
output_schema_ref: order-payment-reconciliation/report
requested_tool_capabilities: [orders.read]
data_processing:
  supported_regions: ["asia-south1"]
  data_classes: ["CONFIDENTIAL"]
  retention_policy_ref: retention/30d
