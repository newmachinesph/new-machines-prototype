kind: agent
key: finance-agent
schema_version: nm.agent.manifest.v1.1
agent_id: finance-agent
version: "1.1.0"
publisher_id: new-machines-labs
publisher_name: New Machines Labs
name: Finance Agent
summary: >-
  Matches each order to the payment that settled it, and explains in one plain sentence any order or payment that does not line up, so a reviewer can act on it.
capabilities: [finance.reconcile]
runtime:
  adapter: google_adk
  model_profile: reasoning
  instructions: instructions.md
  skills: [skills/match-orders.md, skills/explain-mismatch.md]
  tools: []
  max_turns: 6
input_schema_ref: order-payment-reconciliation/input
output_schema_ref: order-payment-reconciliation/match
requested_tool_capabilities: []
data_processing:
  supported_regions: ["asia-south1"]
  data_classes: ["CONFIDENTIAL"]
  retention_policy_ref: retention/30d
